/* ---- app/map.js ---- */
/* ===== Peta: spesifikasi lapisan (murni, diuji di Node) dan pembungkus Leaflet (browser) ===== */

const MAP_BLUE = '#1d6fb8', MAP_ORANGE = '#e07b00';

/**
 * Daftar lapisan untuk digambar: [{no, gi, kind:'polygon'|'circles'|'markers', latlngs, style:{color,dashArray}, bad:number[], radius?}].
 * filter 'aktif' menyembunyikan PMN digantikan/berakhir (kecuali draf); stub dan PMN yang belum dibaca dilewati.
 */
function layerSpecs(S, filter, today) {
  const out = [];
  for (const no of Object.keys(S.pm)) {
    const r = S.pm[no];
    if (r.stub || !r.work) continue;
    const ts = timeStatusOf(S, no, today);
    if (filter === 'aktif' && r.status !== 'draf' && (ts.code === 'superseded' || ts.code === 'expired')) continue;
    const draft = r.status === 'draf';
    const bad = issuesOf(S, no).filter(i => i.pi != null);
    r.work.groups.forEach((g, gi) => {
      if (!g.pts.length) return;
      const latlngs = g.pts.map(q => [q.lat, q.lon]);
      let kind = 'markers';
      if (g.type === 'area' && latlngs.length >= 3) kind = 'polygon';
      else if (g.type === 'circles' || (r.work.radius && g.type !== 'area')) kind = 'circles';
      const spec = {
        no, gi, kind, latlngs,
        style: { color: draft ? MAP_ORANGE : MAP_BLUE, dashArray: draft ? '6 5' : null },
        bad: bad.filter(i => i.gi === gi).map(i => i.pi),
      };
      if (kind === 'circles') spec.radius = r.work.radius || 150;
      out.push(spec);
    });
  }
  return out;
}

/** Titik untuk menyesuaikan tampilan peta; titik bertanda masalah tidak ikut. */
function fitPoints(specs) {
  const pts = [];
  for (const s of specs) s.latlngs.forEach((p, i) => { if (!s.bad.includes(i)) pts.push(p); });
  return pts;
}

/**
 * Pembungkus Leaflet. deps = {L, onOpen(no), onMovePoint(no,gi,pi,lat,lon), onDeletePoint(no,gi,pi), onAddPoint(no,lat,lon), t}.
 * Hanya jalan di browser (diperiksa di Tugas 13). Tombol hapus di popup dipasang lewat popupopen karena Leaflet
 * menghentikan perambatan klik di dalam popup (delegasi data-act dari document tidak akan sampai).
 */
function createMap(el, deps) {
  const L = deps.L;
  const map = L.map(el, { zoomControl: false }).setView([1.28, 103.8], 11);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let editNo = null, addMode = false, view = null;
  const esc2 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const numIcon = (label, bad) => L.divIcon({
    className: '', iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<div style="width:26px;height:26px;border-radius:99px;background:${bad ? '#b42318' : MAP_ORANGE};color:#fff;border:2px solid #fff;font:700 11px/22px sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.5)">${esc2(label)}</div>`,
  });

  map.on('click', e => {
    if (!editNo || !addMode) return;
    addMode = false;
    deps.onAddPoint(editNo, e.latlng.lat, e.latlng.lng);
  });

  function draw(S, filter, today) {
    editNo = null; addMode = false; layer.clearLayers();
    const specs = layerSpecs(S, filter, today);
    for (const s of specs) {
      const opt = { color: s.style.color, weight: 2, dashArray: s.style.dashArray, fillOpacity: 0.18 };
      let l;
      if (s.kind === 'polygon') l = L.polygon(s.latlngs, opt);
      else if (s.kind === 'circles') l = L.featureGroup(s.latlngs.map(p => L.circle(p, Object.assign({}, opt, { radius: s.radius }))));
      else l = L.featureGroup(s.latlngs.map(p => L.circleMarker(p, Object.assign({}, opt, { radius: 6, fillOpacity: 0.7 }))));
      l.bindTooltip(`PMN ${esc2(s.no)}`, { sticky: true }).on('click', () => deps.onOpen(s.no)).addTo(layer);
      for (const pi of s.bad) {
        L.marker(s.latlngs[pi], { icon: L.divIcon({ className: '', html: `<div style="background:#b42318;color:#fff;border-radius:99px;padding:1px 7px;font:600 12px sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">⚠ ${pi + 1}</div>` }) })
          .on('click', () => deps.onOpen(s.no)).addTo(layer);
      }
    }
    const pts = fitPoints(specs);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15));
    setTimeout(() => map.invalidateSize(), 60);
  }

  function edit(S, no) {
    editNo = no; layer.clearLayers();
    const w = S.pm[no].work;
    const bad = new Set(issuesOf(S, no).filter(i => i.pi != null).map(i => `${i.gi}:${i.pi}`));
    const all = [];
    w.groups.forEach((g, gi) => {
      const ll = g.pts.map(q => [q.lat, q.lon]);
      ll.forEach(p => all.push(p));
      const style = { color: MAP_ORANGE, weight: 2, dashArray: '6 5', fillOpacity: 0.15 };
      const poly = g.type === 'area' && ll.length >= 3 ? L.polygon(ll, style).addTo(layer) : L.polyline(ll, { color: MAP_ORANGE, weight: 1, dashArray: '3 6' }).addTo(layer);
      g.pts.forEach((q, pi) => {
        const mk = L.marker([q.lat, q.lon], { draggable: true, icon: numIcon(q.label, bad.has(`${gi}:${pi}`)) }).addTo(layer);
        mk.on('drag', ev => { const c = ev.target.getLatLng(); poly.setLatLngs(g.pts.map((x, i) => (i === pi ? [c.lat, c.lng] : [x.lat, x.lon]))); });
        mk.on('dragend', ev => { const c = ev.target.getLatLng(); deps.onMovePoint(no, gi, pi, c.lat, c.lng); });
        mk.bindPopup(`<b>${esc2(q.label)}</b><br>${esc2(q.latDM)} ${esc2(q.lonDM)}<br><button style="margin-top:6px">${esc2(deps.t('common.delete'))}</button>`);
        mk.on('popupopen', ev => {
          const b = ev.popup.getElement().querySelector('button');
          if (b) b.onclick = () => { map.closePopup(); deps.onDeletePoint(no, gi, pi); };
        });
      });
    });
    if (view) map.setView(view.c, view.z); else if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.2));
  }

  return {
    draw, edit,
    keepView() { view = { c: map.getCenter(), z: map.getZoom() }; },
    stopEdit() { editNo = null; addMode = false; view = null; },
    setAddMode(v) { addMode = !!v; },
    destroy() { map.remove(); },
    raw: map,
  };
}

/* ---- app/controller.js ---- */
/* ===== Pengendali: menghubungkan tindakan pengguna (data-act) ke model, sinkronisasi, dan tampilan ===== */
/* Semua ketergantungan (API, DOM, jam, dialog) disuntikkan lewat deps sehingga bisa diuji di Node. */

const CACHE_KEY = 'pmn-cache';
const NO_RE = /^\d{1,3}\/\d{4}$/;
const hostOf = u => { const m = String(u || '').match(/^https:\/\/([^/\s]+)/i); return m ? m[1] : ''; };
const DEFAULT_OFFICERS = ['Master', 'Chief Officer', '2nd Master', 'Ship phone'];

/**
 * deps = {S, api, sync, storage, i18n, now(), today(), officer(), officers?, live?, makeApi(url, code)?, reload()?, readPdf(file), pdfTextFromBase64(b64),
 *         ask:{confirm, prompt}, clipboard:{write}, dom:{val(id), set(id,v)}, ui:{render, toast, pickFile}, demo?}
 */
function createController(deps) {
  const { S, api, sync, storage, i18n, ask, dom, ui } = deps;
  const st = { tab: 'home', detailNo: null, editRow: null, editData: false, mapEdit: null, mapAdd: false, mapFilter: 'aktif', busy: null, reading: null, demoDown: false, pdf: null };
  const t = (k, p) => i18n.t(k, p);
  const who = () => deps.officer();
  const toast = m => ui.toast(m);

  function ctx() {
    return { S, t: i18n.t, tn: i18n.tn, fmtDate: i18n.fmtDate, now: deps.now(), today: deps.today(), officer: who(), officers: deps.officers || DEFAULT_OFFICERS, live: !!deps.live, serverHost: deps.live ? hostOf(storage.getItem('pmn-server-url')) : '', pdf: st.pdf, busy: st.busy, reading: st.reading, i18n, exportSimulated: true };
  }
  const saveCache = () => { try { storage.setItem(CACHE_KEY, JSON.stringify(S)); } catch (e) { /* abaikan */ } };
  const pending = () => sync.pending();

  /** Simpan lokal, gambar ulang, lalu dorong ke server (tanpa menjatuhkan aplikasi bila gagal). */
  async function persist() {
    saveCache(); ui.render();
    try {
      const r = await sync.push(S);
      if (r.conflicts.length) toast(t('err.conflict'));
      else if (r.errors && r.errors.length) toast(t('err.' + r.errors[0].code));
    } catch (e) { /* offline: sudah diantrekan oleh sync */ }
    saveCache(); ui.render();
  }
  async function flush() {
    try { const r = await sync.flush(S); if (r.conflicts.length) toast(t('err.conflict')); } catch (e) { /* tetap di antrean */ }
    saveCache(); ui.render();
  }
  const statusText = st0 => (st0 ? t('work.' + st0) : '');
  const fail = (res, no) => toast(t('err.' + res.code, { no, status: statusText(res.status) }));
  async function commit(res, no, okMsg) {
    if (!res.ok) { fail(res, no); ui.render(); return res; }
    if (okMsg) toast(okMsg);
    await persist();
    return res;
  }
  const pt = el => ({ gi: +el.dataset.g, pi: +el.dataset.p });

  async function doCheck() {
    let r;
    try { r = await api.runCheck(); } catch (e) { toast(t('err.offline')); return; }
    if (!r.ok) { markCheckFailed(S, deps.now(), r.code); toast(t('err.' + r.code)); await persist(); return; }
    try { await sync.pull(S); } catch (e) { toast(t('err.offline')); return; }
    toast(r.added.length ? t('toast.check_added', { n: r.added.length }) : t('toast.check_none'));
    saveCache(); ui.render();
  }

  async function readOne(no, quiet) {
    st.reading = no; ui.render();
    try {
      const res = await api.getPdf(no);
      if (!res.ok) { toast(t('err.' + res.code)); return; }
      const text = res.text != null ? res.text : await deps.pdfTextFromBase64(res.base64);
      const r = readResult(S, no, parsePmnText(text, { no }), who(), deps.now());
      if (!r.ok) fail(r, no);
    } catch (e) { toast(t('err.pdf_js_load')); } finally { st.reading = null; }
    if (!quiet) await persist();
  }

  /** Pemeriksa silang: HP membaca PDF sendiri dengan pdf.js dan membandingkannya dengan bacaan server (bagian -a/-b: grup yang sesuai). Gagal = diam. */
  const crossBusy = {};
  async function crossRead(no) {
    const r = S.pm[no];
    if (!r || r.stub || !r.parsed) return;
    crossBusy[no] = Date.now();
    try {
      const res = await api.getPdf(no);
      if (!res.ok) return;
      const text = res.text != null ? res.text : await deps.pdfTextFromBase64(res.base64);
      const diffs = crossCheckPart(S, no, toParsed(parsePmnText(text, { no: baseNo(no) })));
      if (r.cross && r.cross.diffs.join() === diffs.join()) return;
      setCross(S, no, diffs, deps.now());
      await persist();
    } catch (e) { /* tanpa pemeriksa silang aplikasi tetap jalan */ }
    finally { delete crossBusy[no]; }
  }

  /** Berpindah antara demo dan server: cache dan antrean lokal milik mode lama dibuang supaya tidak terkirim ke mode baru. */
  const resetLocal = () => { storage.removeItem(CACHE_KEY); storage.removeItem('pmn-outbox'); storage.removeItem('pmn-synced'); };

  const ACT = {
    tab(no) { st.tab = no; st.detailNo = null; st.mapEdit = null; st.mapAdd = false; ui.render(); },
    open(no) {
      st.detailNo = no; st.editRow = null; st.editData = false; st.pdf = null;
      const m = markSeen(S, no, who(), deps.now());
      ui.render();
      if (m.changed) persist();
      crossRead(no);
      ACT.showpdf(no, null, true);
    },
    close() { st.detailNo = null; st.pdf = null; ui.render(); },
    async showpdf(no, el, quiet) {
      let res;
      try { res = await api.getPdf(no); } catch (e) { if (!quiet) toast(t('err.offline')); return; }
      if (st.detailNo !== no && quiet) return;
      if (!res.ok) { if (!quiet) toast(t('err.' + res.code)); st.pdf = null; ui.render(); return; }
      st.pdf = res.text != null ? { no, text: res.text } : { no, base64: res.base64 };
      ui.render();
    },
    hidepdf() { st.pdf = null; ui.render(); },
    check() { return doCheck(); },
    async readAll() {
      for (const no of nosByStatus(S, 'menunggu').reverse()) await readOne(no, true);
      await persist();
    },
    read(no) { return readOne(no, false); },
    pickpdf() { ui.pickFile(); },
    settings() { st.tab = 'settings'; st.detailNo = null; st.mapEdit = null; st.mapAdd = false; ui.render(); },
    async savesettings() {
      const url = String(dom.val('set-url') || '').trim(), code = String(dom.val('set-code') || '').trim();
      if (!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/)[^\s]+$/i.test(url) || !code) { toast(t('err.bad_settings')); return; }
      try { await deps.makeApi(url, code).getState(); }
      catch (e) { toast(e && e.message === 'err_auth' ? t('err.err_auth') : t('err.offline')); return; }
      resetLocal();
      storage.setItem('pmn-server-url', url); storage.setItem('pmn-server-code', code);
      toast(t('toast.settings_saved'));
      deps.reload();
    },
    usedemo() { resetLocal(); storage.removeItem('pmn-server-url'); storage.removeItem('pmn-server-code'); deps.reload(); },
    editpt(no, el) { st.editRow = Object.assign({ no }, pt(el)); ui.render(); },
    cancelpt() { st.editRow = null; ui.render(); },
    savept(no, el) {
      const la = parseDM(dom.val('e-lat'), false), lo = parseDM(dom.val('e-lon'), true);
      if (la == null || lo == null) { toast(t('err.bad_coord')); return; }
      const p = pt(el);
      st.editRow = null;
      return commit(setPoint(S, no, p.gi, p.pi, la, lo, who(), deps.now()), no);
    },
    restorept(no, el) { const p = pt(el); return commit(restorePoint(S, no, p.gi, p.pi, who(), deps.now()), no); },
    delpt(no, el) { const p = pt(el); return commit(deletePoint(S, no, p.gi, p.pi, who(), deps.now()), no); },
    addpt(no) {
      const la = parseDM(dom.val('n-lat'), false), lo = parseDM(dom.val('n-lon'), true);
      if (la == null || lo == null) { toast(t('err.bad_coord')); return; }
      const r = addPoint(S, no, la, lo, String(dom.val('n-lab') || '').trim(), who(), deps.now());
      if (r.ok) { dom.set('n-lat', ''); dom.set('n-lon', ''); dom.set('n-lab', ''); }
      return commit(r, no);
    },
    pastecoords(no) { return commit(pasteCoords(S, no, dom.val('paste-txt'), who(), deps.now()), no); },
    samplepaste() { dom.set('paste-txt', "1 01°18.491' 103°42.623'\n2 01°18.413' 103°42.627'\n3 01°18.417' 103°42.685'\n4 01°18.476' 103°42.668'"); },
    nocoord(no) { return commit(setNoCoords(S, no, who(), deps.now()), no); },
    editdata() { st.editData = true; ui.render(); },
    canceldata() { st.editData = false; ui.render(); },
    savedata(no) {
      const patch = {};
      for (const f of ['title', 'from', 'to', 'hours', 'vhf', 'radius']) patch[f] = dom.val('f-' + f);
      st.editData = false;
      return commit(setData(S, no, patch, who(), deps.now()), no);
    },
    shape(no, el) { return commit(setShape(S, no, +el.dataset.g, el.value, who(), deps.now()), no); },
    ack(no, el) { setAck(S, no, !!el.checked); saveCache(); },
    async approve(no) {
      if (crossBusy[no] && Date.now() - crossBusy[no] < 20000) { toast(t('err.cross_running')); return; }
      const r = approve(S, no, who(), deps.now());
      if (r.ok) { st.detailNo = null; st.pdf = null; }
      return commit(r, no, r.ok ? t('toast.approved', { no }) : null);
    },
    unapprove(no) { return commit(unapprove(S, no, who(), deps.now()), no); },
    reread(no) { return commit(rereadRestore(S, no, who(), deps.now()), no, t('toast.reread')); },
    editmap(no) { st.detailNo = null; st.mapEdit = no; st.mapAdd = false; st.tab = 'map'; ui.render(); },
    mapdone() { st.mapEdit = null; st.mapAdd = false; ui.render(); },
    mapadd() { st.mapAdd = !st.mapAdd; ui.render(); },
    mapfilter(no) { st.mapFilter = no; ui.render(); },
    makeExport() {
      const r = makeExport(S, who(), deps.now(), deps.today());
      return commit(r, null, r.ok ? t('toast.exported', { n: r.export.list.length }) : null);
    },
    exportstep() {
      const r = exportStepDone(S, who(), deps.now());
      return commit(r, null, r.ok && r.done ? t('toast.installed') : null);
    },
    /* tombol demo (hanya bila deps.demo ada) */
    async demo1() { const d = deps.demo; if (!d) return; d.api.queueItems(d.items); await doCheck(); },
    async demo2() {
      const d = deps.demo; if (!d) return;
      const no = d.scenarioItem.no;
      d.api.queueItems([d.scenarioItem]);
      d.api.setText(no, d.scenarioText(d.texts[no]));
      await doCheck();
    },
    async demo3() {
      const d = deps.demo; if (!d) return;
      st.demoDown = !st.demoDown;
      d.api.setFail(st.demoDown ? 'err_mpa_blocked' : null);
      if (st.demoDown) {
        const ago = new Date(Date.parse(deps.now()) - 30 * 36e5).toISOString();
        S.lastCheckOk = ago; S.lastCheck = deps.now();
        addLog(S, 'Server', 'check_failed', { reason: 'err_mpa_blocked' }, deps.now());
        toast(t('toast.demo_down'));
        await persist();
      } else { toast(t('toast.demo_up')); await doCheck(); }
    },
    async demoreset() {
      const d = deps.demo; if (!d) return;
      if (!ask.confirm(t('demo.confirm_reset'))) return;
      st.detailNo = null; st.mapEdit = null; st.tab = 'home'; st.demoDown = false;
      await d.reset();
      await sync.pull(S);
      saveCache(); ui.render();
    },
  };

  async function act(name, no, el) {
    const f = ACT[name];
    if (!f) return;
    try { await f(no, el || { dataset: {} }); } catch (e) {
      // keterangan singkat (nama dan pesan galat, dipotong) supaya penyebab terlihat di layar HP; tidak memuat data PMN atau rahasia
      const why = e && (e.name || e.message) ? ' [' + String((e.name || 'Error') + ': ' + (e.message || '')).slice(0, 110) + ']' : '';
      toast(t('err.unexpected') + why);
      if (typeof console !== 'undefined') console.error(e);
    }
  }

  /** Berkas PDF yang dipilih officer: dibaca, diurai, ditambahkan sebagai draf. */
  async function addFiles(files) {
    for (const f of files) {
      let text;
      try { text = await deps.readPdf(f); } catch (e) { toast(t('err.pdf_js_load')); continue; }
      const result = parsePmnText(text, {});
      const opts = {};
      if (!result.no) {
        const n = ask.prompt(t('pdf.ask_number', { file: f.name }));
        if (!n || !NO_RE.test(String(n).trim())) { toast(t('err.no_number')); continue; }
        opts.no = String(n).trim();
      }
      let r = addFromPdf(S, result, f.name, who(), deps.now(), opts);
      if (!r.ok && r.code === 'exists') {
        const no = opts.no || result.no;
        if (r.status !== 'diekspor' && r.status !== 'terpasang' && ask.confirm(t('pdf.confirm_replace', { no, status: statusText(r.status) }))) {
          r = addFromPdf(S, result, f.name, who(), deps.now(), Object.assign({ replace: true }, opts));
        } else if (r.status === 'diekspor' || r.status === 'terpasang') { fail(r, no); continue; } else continue;
      }
      if (!r.ok) { fail(r); continue; }
      const w = S.pm[r.no].work;
      toast(w.kind === 'plot' ? t('toast.pdf_plot', { no: r.no, n: countPoints(w) }) : t('toast.pdf_kind', { no: r.no, kind: t('toast.kind_' + w.kind) }));
      st.detailNo = r.no;
      await persist();
    }
  }
  const countPoints = w => w.groups.reduce((n, g) => n + g.pts.length, 0);

  async function movePoint(no, gi, pi, lat, lon) { return commit(setPoint(S, no, gi, pi, lat, lon, who(), deps.now()), no); }
  async function addPointAt(no, lat, lon) { st.mapAdd = false; return commit(addPoint(S, no, lat, lon, '', who(), deps.now()), no); }
  function setLang(l) { i18n.setLang(l); if (i18n.getLang() === l) storage.setItem('pmn-lang', l); ui.render(); }

  return { act, st, ctx, pending, flush, persist, addFiles, movePoint, addPointAt, setLang, deps };
}

/* ---- app/main.js ---- */
/* ===== Perangkaian aplikasi di browser: penyimpanan, bahasa, officer, render, peristiwa ===== */

const TABS = [['home', '⌂', 'nav.home'], ['map', '◎', 'nav.map'], ['list', '☰', 'nav.list'], ['export', '⇪', 'nav.export'], ['add', '＋', 'nav.add']];

function startApp(win, doc) {
  const storage = createStorage(win);
  const $ = id => doc.getElementById(id);
  const nowIso = () => new Date().toISOString();
  const deviceLang = () => { const l = String((win.navigator && win.navigator.language) || ''); return /^en/i.test(l) ? 'en' : 'id'; };
  const i18n = createI18n({ id: ID, en: EN }, storage.getItem('pmn-lang') || deviceLang());
  const officer = () => storage.getItem('pmn-officer') || DEFAULT_OFFICERS[0];

  /* mode demo = API tiruan yang tersimpan di perangkat; backend sungguhan datang di Rencana 3 */
  /* mode server: alamat dan kode dari Pengaturan; tanpa keduanya aplikasi berjalan di mode demo */
  const serverUrl = storage.getItem('pmn-server-url'), serverCode = storage.getItem('pmn-server-code');
  const live = !!(serverUrl && serverCode);
  const makeApi = (url, code) => createHttpApi({ url, code, officer, fetch: win.fetch.bind(win) });
  const stubTexts = {};
  for (const it of DEMO_ITEMS) if (DEMO_TEXTS[it.no]) stubTexts[it.no] = DEMO_TEXTS[it.no];
  const api = live ? makeApi(serverUrl, serverCode) : createStubApi(storage, { texts: stubTexts });
  /* demo lokal: bila ada berkas contoh-pdf/ di samping index.html, PDF asli dipakai (halaman tergambar); selain itu teks */
  const stubGetPdf = api.getPdf;
  if (!live) api.getPdf = async no => {
    if (/^https?:/.test(win.location.protocol)) {
      try {
        const r = await win.fetch('contoh-pdf/PMN-' + baseNo(String(no)).replace('/', '-') + '.pdf');
        if (r.ok) {
          const bytes = new Uint8Array(await r.arrayBuffer());
          let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
          return { ok: true, base64: win.btoa(bin) };
        }
      } catch (e) { /* tanpa berkas contoh: pakai teks */ }
    }
    return stubGetPdf(no);
  };
  const memStore = (() => { const m = new Map(); return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) }; })();
  async function seedDemo() {
    if (!DEMO_TEXTS[DEMO_NOS.history[0]]) return;
    const S0 = buildDemoState(DEMO_TEXTS, nowIso(), officer());
    await createSync({ api, storage: memStore, now: nowIso }).push(S0);
  }
  const demo = live ? null : {
    api, items: DEMO_ITEMS, scenarioItem: DEMO_SCENARIO_ITEM, texts: DEMO_TEXTS, scenarioText,
    async reset() { for (const k of ['pmn-stub-server', 'pmn-cache', 'pmn-outbox']) storage.removeItem(k); await seedDemo(); },
  };

  let S = newState();
  try { const c = storage.getItem('pmn-cache'); if (c) S = Object.assign(newState(), JSON.parse(c)); } catch (e) { /* cache rusak: mulai kosong */ }
  const sync = createSync({ api, storage, now: nowIso });
  const fileIn = $('pdfin');
  const toastEl = $('toast');
  let toastTimer = null;
  let mapInst = null, lastTab = null, settingsKey = null;

  const ctrl = createController({
    S, api, sync, storage, i18n, now: nowIso, today: () => sgtToday(new Date()), officer,
    readPdf: readPdfFile,
    pdfTextFromBase64: async b64 => { const bin = win.atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return readPdfFile(new Blob([bytes])); },
    ask: { confirm: m => win.confirm(m), prompt: m => win.prompt(m) },
    clipboard: { write: text => (win.navigator.clipboard ? win.navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard'))) },
    dom: { val: id => { const e = $(id); return e ? e.value : ''; }, set: (id, v) => { const e = $(id); if (e) e.value = v; } },
    ui: { render, toast, pickFile: () => fileIn.click() },
    demo, live, makeApi, reload: () => win.location.reload(),
  });

  function toast(m) { toastEl.textContent = m; toastEl.hidden = false; win.clearTimeout(toastTimer); toastTimer = win.setTimeout(() => { toastEl.hidden = true; }, 3200); }

  function mapDeps() {
    return {
      L: win.L, t: i18n.t,
      onOpen: no => ctrl.act('open', no),
      onMovePoint: (no, gi, pi, lat, lon) => { if (mapInst) mapInst.keepView(); ctrl.movePoint(no, gi, pi, lat, lon); },
      onDeletePoint: (no, gi, pi) => { if (mapInst) mapInst.keepView(); ctrl.act('delpt', no, { dataset: { g: String(gi), p: String(pi) } }); },
      onAddPoint: (no, lat, lon) => { if (mapInst) mapInst.keepView(); ctrl.addPointAt(no, lat, lon); },
    };
  }

  function chrome() {
    const c = ctrl.ctx(), t = i18n.t;
    $('demobar').style.display = live ? 'none' : '';
    if (!live) $('demobar').innerHTML = `<b>DEMO</b><button data-act="demo1">${esc(t('demo.step1'))}</button><button data-act="demo2">${esc(t('demo.step2'))}</button>` +
      `<button data-act="demo3" class="${ctrl.st.demoDown ? 'on' : ''}">${esc(t('demo.step3'))}</button><button data-act="demoreset">${esc(t('demo.reset'))}</button><span class="hint">${esc(t('banner.demo'))}</span>`;
    $('gear').title = t('settings.title');
    $('langs').innerHTML = ['id', 'en'].map(l => `<button data-act="lang" data-no="${l}" class="${i18n.getLang() === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('');
    $('who').innerHTML = DEFAULT_OFFICERS.map(o => `<option${o === officer() ? ' selected' : ''}>${esc(o)}</option>`).join('');
    $('whoLabel').textContent = t('common.officer');
    const unsent = ctrl.pending();
    $('banner').innerHTML = (win.navigator.onLine === false ? `<div class="banner bad">${esc(t('banner.offline'))}</div>` : '') +
      (unsent ? `<div class="banner warn">${esc(i18n.tn('banner.unsent', unsent))}</div>` : '') +
      (storage.persistent ? '' : `<div class="banner warn">${esc(t('banner.no_storage'))}</div>`);
    $('tabs').innerHTML = TABS.map(([k, icon, key]) => `<button data-act="tab" data-no="${k}" class="${ctrl.st.tab === k ? 'on' : ''}"><b>${icon}</b>${esc(t(key))}${k === 'home' && (nosByStatus(S, 'menunggu').length + nosByStatus(S, 'draf').length) ? ' •' : ''}</button>`).join('');
    return c;
  }

  function mapTools() {
    const st = ctrl.st, t = i18n.t;
    if (st.mapEdit) {
      return `<div class="editbar"><b>${esc(t('map.edit_title', { no: st.mapEdit }))}</b><div class="row"><button class="${st.mapAdd ? 'on' : ''}" data-act="mapadd">${esc(st.mapAdd ? t('map.add_active') : t('map.add'))}</button><button data-act="mapdone">${esc(t('map.done'))}</button></div></div>`;
    }
    return `<div class="mapbar"><button class="${st.mapFilter === 'aktif' ? 'on' : ''}" data-act="mapfilter" data-no="aktif">${esc(t('map.filter_active'))}</button><button class="${st.mapFilter === 'semua' ? 'on' : ''}" data-act="mapfilter" data-no="semua">${esc(t('map.filter_all'))}</button></div>` +
      `<div class="legend"><div><i></i>${esc(t('map.legend_approved'))}</div><div><i class="d"></i>${esc(t('map.legend_draft'))}</div><div class="muted" style="margin-top:2px">${esc(t('disclaimer.map'))}</div></div>`;
  }

  /* halaman PDF asli di layar detail: digambar sekali per berkas lalu dipasang ulang saat tampilan digambar ulang */
  const pdfCache = { key: null, nodes: [], busy: false };
  async function drawPdf(key) {
    pdfCache.busy = true;
    try {
      const lib = await loadPdfjs();
      const bin = win.atob(key), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const pdf = await lib.getDocument({ data: bytes }).promise;
      const first = $('pdfpages'); if (first && first.dataset.b64 === key) first.textContent = '';
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n), vp = page.getViewport({ scale: 1.6 });
        const cv = doc.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        pdfCache.nodes.push(cv);
        const el = $('pdfpages'); if (el && el.dataset.b64 === key) el.appendChild(cv);
      }
    } catch (e) {
      const el = $('pdfpages'); if (el) el.textContent = i18n.t('err.pdf_js_load');
      pdfCache.key = null;
    } finally { pdfCache.busy = false; }
  }
  function mountPdf() {
    const el = $('pdfpages'); if (!el) return;
    const key = el.dataset.b64;
    if (pdfCache.key === key) { if (pdfCache.nodes.length) { el.textContent = ''; pdfCache.nodes.forEach(n => el.appendChild(n)); } return; }
    pdfCache.key = key; pdfCache.nodes = [];
    if (!pdfCache.busy) drawPdf(key);
  }

  function render() {
    const c = chrome(), st = ctrl.st, v = $('view');
    if (st.tab === 'map') {
      if (lastTab !== 'map' || !mapInst) {
        if (mapInst) { mapInst.destroy(); mapInst = null; }
        v.className = 'map'; v.innerHTML = '<div id="map"></div><div id="maptools"></div>';
        mapInst = createMap($('map'), mapDeps());
      }
      $('maptools').innerHTML = mapTools();
      mapInst.setAddMode(st.mapAdd);
      if (st.mapEdit && S.pm[st.mapEdit] && S.pm[st.mapEdit].work) mapInst.edit(S, st.mapEdit);
      else { mapInst.stopEdit(); mapInst.draw(S, st.mapFilter, c.today); }
    } else {
      if (mapInst) { mapInst.destroy(); mapInst = null; }
      v.className = '';
      const skey = i18n.getLang() + ':' + live;
      if (!(st.tab === 'settings' && lastTab === 'settings' && settingsKey === skey)) v.innerHTML = ({ home: renderHome, list: renderList, export: renderExport, add: renderAdd, settings: renderSettings })[st.tab](c);
      settingsKey = skey;
    }
    lastTab = st.tab;
    const sheet = $('sheet');
    const keep = sheet.querySelector('.body') ? sheet.querySelector('.body').scrollTop : 0;
    sheet.innerHTML = st.detailNo ? renderDetail(c, st.detailNo, { editRow: st.editRow && st.editRow.no === st.detailNo ? st.editRow : null, editData: st.editData }) : '';
    const nb = sheet.querySelector('.body'); if (nb) nb.scrollTop = keep;
    mountPdf();
  }

  doc.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || ['SELECT', 'INPUT', 'TEXTAREA'].includes(el.tagName)) return;
    if (el.dataset.act === 'lang') { ctrl.setLang(el.dataset.no); return; }
    ctrl.act(el.dataset.act, el.dataset.no, el);
  });
  doc.addEventListener('change', e => {
    const el = e.target;
    if (el.matches && (el.matches('select[data-act]') || el.matches('input[data-act="ack"]'))) ctrl.act(el.dataset.act, el.dataset.no, el);
  });
  fileIn.addEventListener('change', async e => { const files = [...e.target.files]; e.target.value = ''; await ctrl.addFiles(files); });
  $('who').addEventListener('change', e => { storage.setItem('pmn-officer', e.target.value); toast(i18n.t('toast.logged_in', { who: e.target.value })); });

  async function refresh() {
    try { await sync.flush(S); await sync.pull(S); } catch (e) { if (e && e.message === 'err_auth') toast(i18n.t('err.err_auth')); /* selain itu offline: tetap memakai cache */ }
    try { storage.setItem('pmn-cache', JSON.stringify(S)); } catch (e) { /* abaikan */ }
    render();
  }
  win.addEventListener('online', refresh);
  win.addEventListener('offline', render);
  win.addEventListener('storage', e => { if (e.key === 'pmn-stub-server') refresh(); });
  doc.addEventListener('visibilitychange', () => { if (!doc.hidden) refresh(); });

  (async function boot() {
    render();
    if (!live && !storage.getItem('pmn-stub-server')) await seedDemo();
    await refresh();
    if (win.navigator.serviceWorker && /^https?:/.test(win.location.protocol)) { try { win.navigator.serviceWorker.register('sw.js').catch(() => { /* tanpa service worker aplikasi tetap jalan */ }); } catch (e) { /* abaikan */ } }
  })();

  return { ctrl, render, refresh, S };
}

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) startApp(window, document);
