<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5c8e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMN Plotter">

<link rel="apple-touch-icon" href="icon-192.png">
<title>PMN Plotter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14212e;--muted:#5d6b7a;--line:#d8e0e8;--brand:#0b5c8e;--brand-ink:#fff;--ok:#1a7f4b;--okbg:#e2f4ea;--warn:#a85a00;--warnbg:#fff1dc;--bad:#b42318;--badbg:#fde8e6;--info:#4a5a6a;--infobg:#e8edf2;--blue:#1d6fb8}
@media (prefers-color-scheme:dark){:root{--bg:#0d1620;--card:#16222f;--ink:#e6edf4;--muted:#9bacbd;--line:#2a3a4b;--brand:#4aa3df;--brand-ink:#04121d;--ok:#5fd18f;--okbg:#12301f;--warn:#f0b35a;--warnbg:#3a2808;--bad:#ff8f84;--badbg:#401512;--info:#a9b8c7;--infobg:#223140;--blue:#5aa9f0}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--line)}
.demobar{background:#2b2140;color:#e9e0ff;padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demobar b{letter-spacing:.04em}
.demobar button{font:inherit;font-size:11.5px;border:1px solid #6f5aa8;background:#3d2f5c;color:#fff;border-radius:6px;padding:4px 7px;cursor:pointer}
.demobar button:hover{background:#51407a}
.demobar button.on{background:#b42318;border-color:#ff8f84}
/* iPhone (mode layar utama): isi meluas sampai bawah status bar, jadi sisakan area aman di atas dengan warna header */
#app::before{content:"";display:block;flex:none;height:env(safe-area-inset-top);background:var(--brand)}
header.top{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--brand);color:var(--brand-ink)}
header.top h1{font-size:16px;margin:0;flex:1}
header.top select{font:inherit;font-size:13px;border-radius:6px;border:0;padding:5px 6px;background:rgba(255,255,255,.2);color:var(--brand-ink)}
header.top select option{color:#000}
main{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
main.map{padding:0;position:relative;overflow:hidden}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button b{display:block;font-size:17px;line-height:1.1}
nav.tabs button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:12.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card.ok{border-left:4px solid var(--ok)}.card.bad{border-left:4px solid var(--bad);background:var(--badbg)}
.card.warn{border-left:4px solid var(--warn)}.card.act{border-left:4px solid var(--brand)}
.big{font-size:17px;font-weight:650}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:9px;padding:9px 13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.badb{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--infobg);color:var(--info);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.exp,.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ganti{background:var(--infobg);color:var(--muted);text-decoration:line-through}
.chip.soon{background:#e4ecff;color:#2d4fa3}.chip.ok2{background:#dff0f8;color:var(--brand)}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:600;margin:3px 0 5px;font-size:14px}
.item .no{font-weight:700;color:var(--brand)}
.notes{margin:6px 0 0;padding-left:18px}.notes li{margin:3px 0}
.log{font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}.log li{padding:4px 0;border-top:1px solid var(--line)}.log li:first-child{border-top:0}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column}
.sheet .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet .bar b{flex:1}
.sheet .body{flex:1;overflow:auto;padding:12px 14px 24px}
.sheet .foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
dl.f{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:8px 0;font-size:14px}dl.f dt{color:var(--muted)}dl.f dd{margin:0}
table.pts{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.pts th{text-align:left;color:var(--muted);font-weight:600;padding:4px 4px}
table.pts td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.pts tr.flag td{background:var(--badbg)}
table.pts tr.edited td{background:var(--warnbg)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:#14212e;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:2000;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#map{position:absolute;inset:0}
.mapbar{position:absolute;top:10px;left:10px;right:56px;z-index:500;display:flex;gap:6px;flex-wrap:wrap}
.mapbar button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:99px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mapbar button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.editbar{position:absolute;top:0;left:0;right:0;z-index:600;background:var(--warn);color:#fff;padding:8px 12px;font-size:13px}
.editbar .row{margin-top:6px}
.editbar button{font:inherit;font-size:12.5px;border:0;background:#fff;color:#14212e;padding:5px 10px;border-radius:99px;cursor:pointer;font-weight:600}
.editbar button.on{background:#14212e;color:#fff}
.legend{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:6px;border:2px solid var(--blue);background:rgba(29,111,184,.2);vertical-align:-1px}
.legend i.d{border-color:#e07b00;background:rgba(224,123,0,.2);border-style:dashed}
.disc{font-size:11.5px;color:var(--muted);margin-top:8px}
.files{margin:6px 0;padding:0;list-style:none;font-size:13.5px}.files li{padding:5px 8px;background:var(--infobg);border-radius:7px;margin:4px 0;word-break:break-all}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0}
select.sel,input.in,textarea.in{font:inherit;font-size:14px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input.in{width:100%}textarea.in{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
input.pt{width:104px;padding:4px 6px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 label{font-size:12px;color:var(--muted);display:block}
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;margin:6px 0}
.trail span.s{background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 7px;font-weight:600}
.trail span.m{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 7px;font-weight:600}
.trail span.a{color:var(--muted)}
details.d{margin:8px 0}details.d summary{cursor:pointer;font-weight:600;color:var(--brand)}
.pm{font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--infobg);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc .card{margin:0}.pc ul{margin:4px 0 0;padding-left:16px;font-size:13px}.pc li{margin:3px 0}
.langs{display:flex;gap:4px;margin-right:4px}
.langs button{font:inherit;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.5);background:transparent;color:var(--brand-ink);border-radius:6px;padding:3px 8px;cursor:pointer}
.langs button.on{background:#fff;color:var(--brand)}
.banner{padding:6px 14px;font-size:12.5px}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.demobar .hint{opacity:.8;flex-basis:100%;font-size:11px}
#maptools .legend,#maptools .mapbar,#maptools .editbar{position:absolute}


.seen{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.seen.yes{background:var(--okbg);color:var(--ok)}.seen.no{background:var(--badbg);color:var(--bad)}
.pdftext{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:340px;overflow:auto;background:var(--infobg);padding:8px;border-radius:8px;margin:0}
#pdfpages canvas{width:100%;height:auto;display:block;margin:0 0 8px;border:1px solid var(--line);border-radius:6px}
.steps{margin:8px 0 0;padding-left:20px}.steps>li{margin:8px 0;line-height:1.35}.steps .files{margin:4px 0 0}
.pdfbox{max-height:62vh;overflow:auto;border-radius:6px}
.step.done{color:var(--muted)}.step.done .files{display:none}.tick{color:var(--ok);font-weight:700}
.gear{background:transparent;border:1px solid var(--line);color:inherit;border-radius:8px;padding:2px 8px;font-size:16px;line-height:1.4;cursor:pointer}

</style>
</head>
<body>
<div id="app">
  <div class="demobar" id="demobar"></div>
  <header class="top">
    <h1>PMN Plotter</h1>
    <div id="langs" class="langs"></div>
    <label class="small"><span id="whoLabel"></span> <select id="who"></select></label>
    <button id="gear" class="gear" data-act="settings" type="button">⚙</button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div id="sheet"></div>
  <div id="toast" class="toast" hidden></div>
</div>
<input type="file" id="pdfin" accept="application/pdf,.pdf" hidden multiple>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ---- shared/coords.js ---- */
/* ===== Koordinat: dipakai bersama klien, backend, dan uji ===== */

/**
 * Teks lintang/bujur -> derajat desimal, atau null bila tidak valid. Menerima "01 23.079", "01°23.079'N", "1.3079", "1.5 S".
 * Huruf S (lintang) atau W (bujur) membuat nilai negatif; huruf arah di sumbu yang salah (E pada lintang) ditolak.
 */
function parseDM(s, isLon) {
  s = String(s == null ? '' : s).replace(/[º˚]/g, '°').trim();
  let neg = false;
  const h = s.match(/\s*([NSEW])\s*$/i);
  if (h) {
    const letter = h[1].toUpperCase();
    if (isLon ? !/[EW]/.test(letter) : !/[NS]/.test(letter)) return null;
    neg = letter === 'S' || letter === 'W';
    s = s.slice(0, h.index).trim();
  }
  let v = null;
  if (/^\d{1,3}\.\d+$/.test(s)) v = +s;
  else {
    const m = s.match(/(\d{1,3})\D+(\d{1,2}(?:\.\d+)?)/);
    if (m && +m[2] < 60) v = +m[1] + +m[2] / 60;
  }
  if (v == null || isNaN(v)) return null;
  if (isLon ? v > 180 : v > 90) return null;
  return neg ? -v : v;
}

/** Derajat desimal -> "01°23.079'N" (bujur: 3 digit derajat, E/W). */
function fmtDM(v, isLon) {
  const hemi = v < 0 ? (isLon ? 'W' : 'S') : (isLon ? 'E' : 'N');
  v = Math.abs(v);
  let d = Math.floor(v), m = (v - d) * 60;
  if (+m.toFixed(3) >= 60) { d++; m = 0; }
  return `${String(d).padStart(isLon ? 3 : 2, '0')}°${m.toFixed(3).padStart(6, '0')}'${hemi}`;
}

/** Jarak dua titik {lat, lon} dalam meter (radius bumi 6371000 m). */
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ---- shared/pmnparse.js ---- */
/* ===== Dates ===== */
const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONRE='(JAN(?:UARY)?|FEB(?:RUARY)?|MAR(?:CH)?|APR(?:IL)?|MAY|JUNE?|JULY?|AUG(?:UST)?|SEPT?(?:EMBER)?|OCT(?:OBER)?|NOV(?:EMBER)?|DEC(?:EMBER)?)';
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function parseDates(text,refYear){
  const re=new RegExp('(?<!\\d)(\\d{1,2})\\s*'+MONRE+'(?![A-Z])\\.?(?:\\s*(\\d{4}|\\d{2})(?!\\d))?','gi');
  const ds=[];let m;
  while((m=re.exec(text)))ds.push({d:+m[1],mo:MONS.indexOf(m[2].slice(0,3).toUpperCase()),y:m[3]?(m[3].length===2?2000+(+m[3]):+m[3]):null});
  if(!ds.length)return null;
  const a=ds[0],b=ds[ds.length-1],warn=[];
  if(b.y==null)b.y=a.y??refYear??new Date().getFullYear();
  if(a.y==null)a.y=a.mo>b.mo?b.y-1:b.y;
  const mk=x=>{const dim=new Date(x.y,x.mo+1,0).getDate();if(x.d>dim){warn.push(`tanggal "${x.d} ${MONS[x.mo]}" tidak ada`);x.d=dim}return new Date(x.y,x.mo,x.d)};
  const from=mk(a),to=mk(b);
  if(ds.length===1)warn.push('hanya ada satu tanggal');
  if(to<from)warn.push('tanggal akhir lebih awal dari tanggal mulai');
  return {from:ds.length>1?from:null,to,warn,count:ds.length};
}

/* ===== Coordinates ===== */
const COORD=/(\d{1,2})\s*°\s*(\d{1,2}[.·ꞏ]\d+)\s*['’′]?\s*([NS])?\s+(\d{2,3})\s*°\s*(\d{1,2}[.·ꞏ]\d+)\s*['’′]?\s*([EW])?/;
const num=s=>parseFloat(s.replace(/[·ꞏ]/g,'.'));
/* Baris yang tampak seperti koordinat (dua pasang derajat-menit desimal) walau gagal dibaca. */
const LOOSE=/\d{1,3}\s*°\s*\d{1,2}\s*[.·ꞏ,]\s*\d+[^\d]{0,12}\d{1,3}\s*°\s*\d{1,2}\s*[.·ꞏ,]\s*\d+/;
/* Kerusakan OCR umum: derajat hilang atau terbaca o/º, dan huruf l/I/O di dalam angka desimal menit. Dua pasang derajat-menit desimal tiga digit
   pada satu baris (format MPA) yang tidak terbaca harus dihitung sebagai baris terbuang agar muncul peringatan. */
const LOOSE2=/\d{1,3}\s*[°oO]?\s*\d{1,2}\s*[.·ꞏ,]\s*\d[0-9lIO]{2}\b.{0,16}?\d{1,3}\s*[°oO]?\s*\d{1,2}\s*[.·ꞏ,]\s*\d[0-9lIO]{2}\b/;
const GARBLE=/\d{1,2}[.·ꞏ,]\d{0,2}[lIOo]\d/;
function parseCoords(text){return parseCoordsEx(text).groups}
/* Mengembalikan {groups, dropped}: dropped = jumlah baris mirip-koordinat yang tidak bisa dibaca. Tidak ada titik yang dibuang diam-diam. */
function parseCoordsEx(text){
  text=normDeg(text);
  let dropped=0;
  const groups=[];let cur={name:'Area',pts:[]};
  const radiusCol=/radius/i.test(text);
  for(const line of text.split(/\r?\n/)){
    if(GARBLE.test(line)&&LOOSE2.test(line)){dropped++;continue}
    const m=line.match(COORD);
    if(!m){if(LOOSE.test(line)||LOOSE2.test(line))dropped++;const h=line.match(/working\s+area\s*([A-Z0-9]{1,3})\b/i);if(h){if(cur.pts.length)groups.push(cur);cur={name:'Area '+h[1].toUpperCase(),pts:[]}}continue}
    const latD=+m[1],latM=num(m[2]),lonD=+m[4],lonM=num(m[5]);
    if(latM>=60||lonM>=60){dropped++;continue}
    let lat=latD+latM/60,lon=lonD+lonM/60;if(m[3]==='S')lat=-lat;if(m[6]==='W')lon=-lon;
    let label=line.slice(0,m.index).replace(/^(working\s+area\s*[A-Z0-9]{1,3}\b)/i,'').trim()||String(cur.pts.length+1);
    if(label.length>30)label=label.slice(-30).trim();
    const tail=line.slice(m.index+m[0].length);
    const rm=radiusCol&&tail.match(/^\s*(\d{2,4})(?:\s*m)?\b/);
    if(cur.pts.some(p=>Math.abs(p.lat-lat)<1e-7&&Math.abs(p.lon-lon)<1e-7))continue;
    cur.pts.push({label,lat,lon,r:rm?+rm[1]:null,
      latDM:`${String(latD).padStart(2,'0')}°${latM.toFixed(3)}'${m[3]||'N'}`,lonDM:`${String(lonD).padStart(3,'0')}°${lonM.toFixed(3)}'${m[6]||'E'}`});
  }
  if(cur.pts.length)groups.push(cur);
  return {groups,dropped};
}

/* ===== Whole PMN document ===== */
/* Simbol derajat alternatif (º U+00BA, ˚ U+02DA) dinormalkan menjadi ° sebelum dibaca. PMN 112 memakai º. */
const normDeg=t=>t.replace(/[º˚]/g,'°');
/* Judul cadangan untuk PDF tanpa baris "Applicable to" (mis. pengumuman): baris huruf kapital tepat setelah baris "... Community". */
function titleFallback(text){
  const ls=text.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,16);
  let i=-1;ls.forEach((l,k)=>{if(/Community\s*$/i.test(l))i=k});
  const t=[];for(let k=i+1;k<ls.length&&/^[^a-z]*[A-Z][^a-z]*$/.test(ls[k])&&!/^\d/.test(ls[k]);k++)t.push(ls[k]);
  return t.join(' ');
}
/** Tanggal terbit: baris tunggal "d Mon yyyy" tepat setelah baris "NO. n OF yyyy". Null bila tidak ada atau tanggalnya tidak ada di kalender. */
function publishedAfterNo(main){
  const m=main.match(/NO\.?\s*0*\d{1,3}\s*OF\s*\d{4}[^\n]*\n+\s*([^\n]+)/i);
  if(!m)return null;
  const d=m[1].trim().match(new RegExp('^(\\d{1,2})\\s+'+MONRE+'\\s+(\\d{4})$','i'));
  if(!d)return null;
  const day=+d[1],mo=MONS.indexOf(d[2].slice(0,3).toUpperCase()),y=+d[3];
  if(day<1||day>new Date(y,mo+1,0).getDate())return null;
  return isoOf(new Date(y,mo,day));
}
function parsePmnText(text,hint={}){
  const full=normDeg(text).replace(/ /g,' ');
  const cut=full.search(/PORT\s*MASTER\s*\n?\s*MARITIME AND PORT AUTHORITY/i);
  const main=cut>0?full.slice(0,cut):full;
  const r={warn:[]};
  if(text.trim().length<80){
    r.warn.push({code:'no_text'});r.no=hint.no||undefined;r.year=r.no?+r.no.split('/')[1]:null;r.title=(hint.title||'').trim();r.groups=[];r.kind='check';r.published=null;return r;
  }
  const no=main.match(/NO\.?\s*0*(\d{1,3})\s*OF\s*(\d{4})/i);
  if(no){r.no=`${+no[1]}/${no[2]}`}else if(hint.no)r.no=hint.no;
  r.published=publishedAfterNo(main);
  if(hint.no&&r.no&&hint.no!==r.no)r.warn.push({code:'number_mismatch',pdf:r.no,list:hint.no});
  if(!r.no)r.warn.push({code:'no_number'});
  r.year=+(r.no||'0/0').split('/')[1]||null;
  // title: lines between the last "... Community" line and "Applicable to"
  const ls=main.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const ai=ls.findIndex(l=>/^Applicable\s+to/i.test(l));
  let title='';
  if(ai>0){const t=[];for(let k=ai-1;k>=0&&!/Community\s*$|^\d{1,2}\s+\w+\s+\d{4}$|^NO\.?\s*\d/i.test(ls[k]);k--)t.unshift(ls[k]);title=t.join(' ')}
  r.title=(hint.title||title||titleFallback(main)||'').replace(/\s+/g,' ').trim();
  // validity
  const di=main.search(/with\s+effect\s+from|take\s+effect\s+on|effect\s+on|commence\s+on|commence\b/i);
  if(di>=0){const dt=parseDates(main.slice(di,di+170),r.year);
    if(dt){r.from=isoOf(dt.from||dt.to);r.to=isoOf(dt.to);dt.warn.filter(w=>!/satu tanggal/.test(w)).forEach(w=>{if(/lebih awal/.test(w))r.warn.push({code:'dates_reversed'});else{const q=w.match(/"([^"]+)"/);r.warn.push({code:'date_not_exist',text:q?q[1]:w})}})}}
  const sup=main.match(/(?:supersedes|revision\s+of)\s+Port\s+Marine\s+(?:Notice\s+)?No\.?\s*0*(\d+)\s+of\s+(\d{4})/i);
  if(sup)r.supersedes=`${+sup[1]}/${sup[2]}`;
  const vhf=main.match(/VHF\s+Channel\s*(\d+)\s*\(([^)]+)\)/i);if(vhf)r.vhf=`VHF ${vhf[1]} ${vhf[2].replace(/\s+/g,' ')}`;
  const wh=main.match(/Working\s*Hours?\s*:?\s*([^\n]{3,80})/i);if(wh)r.hours=wh[1].replace(/^:\s*/,'').replace(/\.$/,'').trim();
  const rad=main.match(/radius\s+of\s+(\d{2,4})\s*-?\s*m|(\d{2,4})\s*-?\s*m(?:etres?|eters?)?\s+radius|safe\s+working\s+zone\s+of\s+(\d{2,4})\s*m/i);
  if(rad)r.radius=+(rad[1]||rad[2]||rad[3]);
  // geometry
  const pc=parseCoordsEx(main);r.groups=pc.groups;
  const npts=r.groups.reduce((a,g)=>a+g.pts.length,0);
  const mentionsCoords=/co-?ordinates|latitude|chartlet/i.test(main);
  const otherFmt=/\d{1,3}\s*°\s*\d{1,2}\s*['’′]\s*\d{1,2}(?:\.\d+)?\s*["”″]/.test(main)||/\d{1,3}\.\d{3,}\s*°\s*[NSEW]?/.test(main);
  if(!npts){
    if(otherFmt){r.kind='check';r.warn.push({code:'unsupported_format'})}
    else{r.kind=mentionsCoords?'check':'advisory';if(r.kind==='check')r.warn.push({code:'coords_unreadable'})}
  }
  else{
    r.kind='plot';
    const bounded=/bounded\s+by|working\s+area|within\s+the\s+area|demarcated/i.test(main);
    r.groups.forEach(g=>{g.type=g.pts.every(p=>p.r)?'circles':(g.pts.length>=3&&bounded?'area':'points')});
  }
  if(pc.dropped>0)r.warn.push({code:'dropped_lines',n:pc.dropped});
  if(!r.no)r.kind='check';
  return r;
}

/* ---- shared/rules.js ---- */
/* ===== Aturan PMN: murni (tanpa API Google/browser), dipakai klien, backend, dan uji ===== */

/** Tanggal ISO (YYYY-MM-DD) di Asia/Singapore (UTC+8, tanpa DST) untuk sebuah instan. */
function sgtToday(now) {
  return new Date(now.getTime() + 8 * 3600e3).toISOString().slice(0, 10);
}

/**
 * Status waktu sebuah PMN. work = {kind, from, to} atau null (belum dibaca).
 * Mengembalikan {code, days?}; days hanya untuk 'ending_soon' (hari dari today ke to).
 */
function timeStatus(work, supersededBy, today) {
  if (supersededBy) return { code: 'superseded' };
  if (!work) return { code: 'unread' };
  if (work.kind === 'advisory') return { code: 'info' };
  if (!work.from || !work.to) return { code: 'dates_unknown' };
  if (today < work.from) return { code: 'upcoming' };
  if (today > work.to) return { code: 'expired' };
  const days = Math.round((Date.parse(work.to) - Date.parse(today)) / 864e5);
  return days <= 14 ? { code: 'ending_soon', days } : { code: 'active' };
}

/* ----- Nomor PMN, urutan, penggantian ----- */
const numOf = no => +no.split('/')[0];
const yearOf = no => parseInt(no.split('/')[1], 10);

/** Nomor induk tanpa akhiran area: "137/2026-a" -> "137/2026". */
const baseNo = no => no.replace(/-[a-z]+$/i, '');

/** Akhiran area huruf kecil ("a", "b") atau null bila tidak ada. */
function suffixOf(no) {
  const m = /-([a-z]+)$/i.exec(no);
  return m ? m[1].toLowerCase() : null;
}

/** Kunci bagian ke-index (mulai 0) dari total bagian: satu bagian tetap nomor induk, lebih dari satu diberi -a, -b, ... */
function partKey(base, index, total) {
  return total > 1 ? base + '-' + String.fromCharCode(97 + index) : base;
}

/** Nama objek di ECDIS: "PMN 137/2026-A". */
function ecdisName(no) {
  const sfx = suffixOf(no);
  return 'PMN ' + baseNo(no) + (sfx ? '-' + sfx.toUpperCase() : '');
}

/** Urut tahun menurun, nomor menurun, lalu akhiran menaik (tanpa akhiran lebih dulu). Tidak mengubah array asal. */
function sortDesc(nos) {
  return nos.slice().sort((a, b) =>
    yearOf(b) - yearOf(a) || numOf(b) - numOf(a) ||
    (suffixOf(a) || '').localeCompare(suffixOf(b) || ''));
}

/**
 * Peta penggantian {nomorIndukLama: nomorIndukBaru} dari daftar {no, supersedes}.
 * Bila dua PMN menggantikan nomor yang sama, yang bernomor lebih besar menang; rantai tidak digabung.
 * Akhiran area diabaikan: "140/2026-a" menggantikan sebagai "140/2026".
 */
function supersedeMap(list) {
  const map = {};
  for (const p of list) {
    const base = baseNo(p.no);
    if (!p.supersedes || p.supersedes === base) continue;
    const cur = map[p.supersedes];
    if (!cur || yearOf(base) > yearOf(cur) || (yearOf(base) === yearOf(cur) && numOf(base) > numOf(cur))) map[p.supersedes] = base;
  }
  return map;
}

/** Nomor yang hilang di antara nomor terkecil dan terbesar per tahun, terurut naik tahun lalu nomor. */
function findGaps(nos) {
  const byYear = {};
  for (const no of nos) (byYear[yearOf(no)] = byYear[yearOf(no)] || new Set()).add(numOf(no));
  const out = [];
  for (const y of Object.keys(byYear).map(Number).sort((a, b) => a - b)) {
    const set = byYear[y], nums = [...set];
    const lo = Math.min(...nums), hi = Math.max(...nums);
    for (let n = lo + 1; n < hi; n++) if (!set.has(n)) out.push(`${n}/${y}`);
  }
  return out;
}

/* ----- Masalah yang harus diperiksa officer (butuh haversine dari shared/coords.js di lingkup global) ----- */
const WATERS = { latMin: 1.0, latMax: 1.6, lonMin: 103.4, lonMax: 104.3 };
const FAR_POINT_M = 5000;

/**
 * Daftar masalah pada sebuah PMN. work = {kind, from, to, groups}; parsedGroups = bacaan asli (opsional, untuk shape_doubt).
 * Kode: no_coords (block), outside_waters, far_point, dates_reversed, shape_doubt.
 */
function issues(work, parsedGroups) {
  const out = [];
  const groups = work.groups || [];
  const total = groups.reduce((n, g) => n + g.pts.length, 0);
  if ((work.kind === 'plot' || work.kind === 'check') && !total) out.push({ code: 'no_coords', block: true });
  groups.forEach((g, gi) => {
    g.pts.forEach((q, pi) => {
      if (q.lat < WATERS.latMin || q.lat > WATERS.latMax || q.lon < WATERS.lonMin || q.lon > WATERS.lonMax) {
        out.push({ code: 'outside_waters', gi, pi, label: q.label });
      }
      if (g.pts.length >= 3) {
        let nearest = Infinity;
        g.pts.forEach((o, oi) => { if (oi !== pi) nearest = Math.min(nearest, haversine(q, o)); });
        if (nearest > FAR_POINT_M) out.push({ code: 'far_point', gi, pi, label: q.label, km: Math.round(nearest / 1000) });
      }
    });
    const orig = parsedGroups && parsedGroups[gi];
    const unchanged = !parsedGroups || (orig && orig.type === 'area');
    if (g.type === 'area' && unchanged && g.pts.length && g.pts.every(q => /[A-Za-z]{3,}/.test(q.label))) {
      out.push({ code: 'shape_doubt', gi });
    }
  });
  if (work.from && work.to && work.from > work.to) out.push({ code: 'dates_reversed' });
  return out;
}

/* ===== Bentuk record PMN yang dipakai klien dan server ===== */
/* Fungsi murni tanpa API Google atau DOM. Dipakai app/model.js dan backend/pipeline.js. Bergantung pada tidak ada fungsi shared lain. */

const clone = o => JSON.parse(JSON.stringify(o));

function blankRecord(rss, src) {
  return { status: 'menunggu', rss, src, parsed: null, work: null, changes: [], ack: false, ver: 0 };
}

/** Hasil parsePmnText -> bentuk Parsed yang disimpan. */
function toParsed(result, fallbackTitle) {
  const out = {
    title: result.title || fallbackTitle || '',
    kind: result.kind,
    published: result.published || null,
    from: result.from || null,
    to: result.to || null,
    hours: result.hours || null,
    vhf: result.vhf || null,
    radius: result.radius || null,
    supersedes: result.supersedes || null,
    groups: clone(result.groups || []),
    warn: clone(result.warn || []),
  };
  if (result.body != null) out.body = result.body;
  return out;
}

/** Nilai kerja awal dari bacaan asli: salinan tanpa body (isi PMN hanya disimpan sekali, di parsed). */
function workFromParsed(parsed) {
  const w = clone(parsed);
  delete w.body;
  return w;
}

/** Menerapkan bacaan ke record: draf, bacaan asli (parsed) dan nilai kerja (work) terpisah. reader: 'ocr' bila dibaca server. */
function applyReading(r, result, who, reader) {
  r.parsed = toParsed(result, r.rss && r.rss.title);
  if (reader) r.parsed.reader = reader;
  r.work = workFromParsed(r.parsed);
  r.status = 'draf';
  r.readBy = who;
  r.ack = false;
  r.changes = [];
  return r;
}

/* ===== Mesin terjemah: t, tn, fmtDate, setLang, getLang ===== */

const MONTHS = {
  id: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
};

/**
 * catalogs = {id: {...}, en: {...}}; lang = 'id' | 'en'.
 * Kunci yang tidak ada di bahasa aktif jatuh ke bahasa Indonesia, lalu ke kuncinya sendiri; selalu dicatat di `missing`.
 */
function createI18n(catalogs, lang) {
  let cur = catalogs[lang] ? lang : 'id';
  const missing = [];
  const fill = (s, params) => s.replace(/\{(\w+)\}/g, (m, k) => (params && params[k] != null ? String(params[k]) : m));
  function t(key, params) {
    let s = catalogs[cur][key];
    if (s == null) {
      if (!missing.includes(key)) missing.push(key);
      s = cur !== 'id' && catalogs.id ? catalogs.id[key] : null; // jatuh ke bahasa Indonesia, lalu ke kunci
      if (s == null) return key;
    }
    return fill(s, params);
  }
  function tn(key, n, params) {
    return t(key + (n === 1 ? '.one' : '.other'), Object.assign({ n }, params));
  }
  function fmtDate(iso) {
    const [y, m, d] = iso.slice(0, 10).split('-');
    return `${+d} ${MONTHS[cur][+m - 1]} ${y}`;
  }
  function setLang(l) { if (catalogs[l]) cur = l; }
  function getLang() { return cur; }
  return { t, tn, fmtDate, setLang, getLang, missing };
}

/* ---- app/storage.js ---- */
/* ===== Penyimpanan lokal yang aman: localStorage bila bisa, memori bila tidak (mode privat, kuota penuh) ===== */

/** win = window (atau objek mirip). Mengembalikan {getItem, setItem, removeItem, persistent}. Tidak pernah melempar galat. */
function createStorage(win) {
  const mem = new Map();
  let ls = null, persistent = false;
  try {
    ls = win.localStorage;
    if (ls) { ls.getItem('pmn-probe'); persistent = true; }
  } catch (e) { ls = null; persistent = false; }
  return {
    persistent,
    getItem(k) {
      if (ls) { try { const v = ls.getItem(k); if (v !== null) return v; } catch (e) { /* jatuh ke memori */ } }
      return mem.has(k) ? mem.get(k) : null;
    },
    setItem(k, v) {
      v = String(v);
      mem.set(k, v);
      if (ls) { try { ls.setItem(k, v); } catch (e) { /* kuota penuh: nilai tetap ada di memori */ } }
    },
    removeItem(k) {
      mem.delete(k);
      if (ls) { try { ls.removeItem(k); } catch (e) { /* abaikan */ } }
    },
  };
}

/* ---- app/model.js ---- */
/* ===== Model klien: keadaan S dan semua transisinya ===== */
/* Fungsi mengubah S di tempat dan mengembalikan {ok} atau {ok:false, code}. Bergantung pada fungsi global dari shared/*
   (timeStatus, issues, sortDesc, numOf, supersedeMap, parseCoords, fmtDM, exportNames, clone, blankRecord, toParsed, workFromParsed, applyReading), seperti di browser. */

const MAX_LOG = 100;
const LOCKED = ['diekspor', 'terpasang'];
const EXPORT_STEPS = 4;

function newState() {
  return { lastCheck: null, lastCheckOk: null, pm: {}, lastExport: null, lastInstalled: null, log: [] };
}

function addLog(S, who, code, params, at) {
  S.log.unshift({ at, who, code, params: params || {} });
  if (S.log.length > MAX_LOG) S.log.length = MAX_LOG;
}

/* ----- Cek harian ----- */
function ingestCheck(S, items, now) {
  const added = [];
  for (const it of items) {
    if (S.pm[it.no]) continue;
    S.pm[it.no] = blankRecord({ title: it.title, published: it.published, link: it.link }, 'server');
    added.push(it.no);
  }
  S.lastCheck = now;
  S.lastCheckOk = now;
  if (added.length) addLog(S, 'Server', 'check_found', { n: added.length, nos: added }, now);
  else addLog(S, 'Server', 'check_none', {}, now);
  return { added };
}

function markCheckFailed(S, now, reason) {
  S.lastCheck = now;
  addLog(S, 'Server', 'check_failed', { reason }, now);
}

function staleness(S, now) {
  if (!S.lastCheckOk) return { stale: true, hours: null };
  const hours = (Date.parse(now) - Date.parse(S.lastCheckOk)) / 36e5;
  return { stale: hours > 24, hours };
}

/* ----- Baca PDF ----- */
function readResult(S, no, result, who, now) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  if (LOCKED.includes(r.status)) return { ok: false, code: 'locked' };
  applyReading(r, result, who);
  addLog(S, who, 'read', { no }, now);
  return { ok: true };
}

/** Record PMN lama yang hanya ada di riwayat Excel (dipakai rantai penggantian). Tidak menimpa record yang ada. */
function addHistoryStub(S, no, title) {
  if (S.pm[no]) return;
  const r = blankRecord({ title: title || null, published: null, link: null }, 'server');
  r.status = 'terpasang';
  r.stub = true;
  S.pm[no] = r;
}

/* ----- Turunan ----- */
function supersededBy(S, no) {
  const list = [];
  for (const k of Object.keys(S.pm)) {
    const w = S.pm[k].work;
    if (w && w.supersedes) list.push({ no: k, supersedes: w.supersedes });
  }
  return supersedeMap(list)[baseNo(no)] || null;
}

function timeStatusOf(S, no, today) {
  const r = S.pm[no];
  return timeStatus(r.work || null, supersededBy(S, no), today);
}

function issuesOf(S, no) {
  const r = S.pm[no];
  return r && r.work ? issues(r.work, r.parsed && r.parsed.groups) : [];
}

function nosByStatus(S, status) {
  return sortDesc(Object.keys(S.pm).filter(n => !S.pm[n].stub && S.pm[n].status === status));
}

/* ----- Koreksi ----- */
const SHAPES = ['area', 'points', 'circles'];
const DATA_FIELDS = ['title', 'from', 'to', 'hours', 'vhf', 'radius'];
const totalPts = w => (w.groups || []).reduce((n, g) => n + g.pts.length, 0);
const ptText = q => `${q.latDM} ${q.lonDM}`;

/** Record yang boleh diedit, atau {err}. */
function editable(S, no) {
  const r = S.pm[no];
  if (!r) return { err: { ok: false, code: 'unknown' } };
  if (!r.work) return { err: { ok: false, code: 'no_work' } };
  if (LOCKED.includes(r.status)) return { err: { ok: false, code: 'locked' } };
  return { r };
}

function pushChange(r, who, now, c) {
  r.changes.push(Object.assign({ at: now, who }, c));
  r.ack = false;
  if (r.status === 'disetujui') r.status = 'draf';
}

function pointAt(r, gi, pi) {
  const g = r.work.groups[gi];
  return g && g.pts[pi] ? { g, q: g.pts[pi] } : null;
}

function writePoint(q, lat, lon) {
  q.lat = lat; q.lon = lon;
  q.latDM = fmtDM(lat, false); q.lonDM = fmtDM(lon, true);
}

function setPoint(S, no, gi, pi, lat, lon, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const at = pointAt(e.r, gi, pi); if (!at) return { ok: false, code: 'bad_index' };
  const q = at.q;
  if (q.lat === lat && q.lon === lon) return { ok: false, code: 'no_change' };
  const old = ptText(q);
  writePoint(q, lat, lon);
  pushChange(e.r, who, now, { kind: 'point_set', label: q.label, old, nw: ptText(q) });
  addLog(S, who, 'edit_point', { no, label: q.label }, now);
  return { ok: true };
}

function restorePoint(S, no, gi, pi, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const at = pointAt(e.r, gi, pi); if (!at) return { ok: false, code: 'bad_index' };
  const pg = e.r.parsed && e.r.parsed.groups[gi];
  const orig = pg && pg.pts.find(p => p.label === at.q.label);
  if (!orig) return { ok: false, code: 'bad_index' };
  if (orig.lat === at.q.lat && orig.lon === at.q.lon) return { ok: false, code: 'no_change' };
  const old = ptText(at.q);
  writePoint(at.q, orig.lat, orig.lon);
  at.q.latDM = orig.latDM; at.q.lonDM = orig.lonDM;
  pushChange(e.r, who, now, { kind: 'point_restore', label: at.q.label, old, nw: ptText(at.q) });
  addLog(S, who, 'edit_point', { no, label: at.q.label }, now);
  return { ok: true };
}

function deletePoint(S, no, gi, pi, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const at = pointAt(e.r, gi, pi); if (!at) return { ok: false, code: 'bad_index' };
  const q = at.g.pts.splice(pi, 1)[0];
  pushChange(e.r, who, now, { kind: 'point_del', label: q.label, old: ptText(q), nw: '' });
  addLog(S, who, 'delete_point', { no, label: q.label }, now);
  return { ok: true };
}

function addPoint(S, no, lat, lon, label, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const w = e.r.work;
  if (!w.groups.length) w.groups.push({ name: 'Area', type: 'points', pts: [] });
  const g = w.groups[w.groups.length - 1];
  const lab = label || String(g.pts.length + 1);
  const q = { label: lab, lat: 0, lon: 0, r: null, latDM: '', lonDM: '' };
  writePoint(q, lat, lon);
  g.pts.push(q);
  if (w.kind === 'check') w.kind = 'plot';
  if (g.pts.length >= 3 && g.type === 'points' && w.groups.length === 1 && !(e.r.parsed && e.r.parsed.groups.length)) g.type = 'area';
  pushChange(e.r, who, now, { kind: 'point_add', label: lab, old: '', nw: ptText(q) });
  addLog(S, who, 'add_point', { no, label: lab }, now);
  return { ok: true };
}

function setShape(S, no, gi, type, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const g = e.r.work.groups[gi];
  if (!g || !SHAPES.includes(type)) return { ok: false, code: 'bad_index' };
  if (g.type === type) return { ok: false, code: 'no_change' };
  const old = g.type;
  g.type = type;
  pushChange(e.r, who, now, { kind: 'shape', old, nw: type });
  addLog(S, who, 'set_shape', { no, type }, now);
  return { ok: true };
}

function setData(S, no, patch, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const w = e.r.work;
  let changed = 0;
  for (const f of DATA_FIELDS) {
    if (!(f in patch)) continue;
    let nv = patch[f] == null ? '' : String(patch[f]).trim();
    const old = w[f] == null ? '' : String(w[f]);
    if (nv === old) continue;
    w[f] = nv === '' ? null : (f === 'radius' ? Number(nv) : nv);
    if (f === 'title' && !w[f]) w[f] = '';
    pushChange(e.r, who, now, { kind: 'data', field: f, old, nw: nv });
    changed++;
  }
  if (!changed) return { ok: false, code: 'no_change' };
  addLog(S, who, 'edit_data', { no }, now);
  return { ok: true };
}

function setNoCoords(S, no, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const w = e.r.work;
  if (totalPts(w)) return { ok: false, code: 'has_points' };
  if (w.kind === 'advisory') return { ok: false, code: 'no_change' };
  const old = w.kind;
  w.kind = 'advisory';
  pushChange(e.r, who, now, { kind: 'no_coords', old, nw: 'advisory' });
  addLog(S, who, 'no_coords', { no }, now);
  return { ok: true };
}

function rereadRestore(S, no, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const r = e.r;
  r.work = workFromParsed(r.parsed);
  r.changes = [];
  r.ack = false;
  r.status = 'draf';
  addLog(S, who, 'read_again', { no }, now);
  return { ok: true };
}

function setAck(S, no, value) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  r.ack = !!value;
  return { ok: true };
}

/* ----- Acknowledge per officer dan pemeriksa silang ----- */
/** Officer membuka PMN sendiri = acknowledge. Bukan suntingan, jadi boleh pada PMN terkunci. */
function markSeen(S, no, who, now) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  if (r.stub) return { ok: true, changed: false };
  r.seen = r.seen || {};
  if (r.seen[who]) return { ok: true, changed: false };
  r.seen[who] = now;
  return { ok: true, changed: true };
}

/** Beda antara dua bacaan (Parsed): kode 'kind', 'dates', 'points', 'coords'. Kosong = sama. */
function crossCheck(a, b) {
  const out = [];
  if (a.kind !== b.kind) out.push('kind');
  if ((a.from || null) !== (b.from || null) || (a.to || null) !== (b.to || null)) out.push('dates');
  const counts = p => (p.groups || []).map(g => g.pts.length).join(',');
  if (counts(a) !== counts(b)) out.push('points');
  else {
    const flat = p => (p.groups || []).flatMap(g => g.pts);
    const fa = flat(a), fb = flat(b);
    if (fa.some((q, i) => Math.abs(q.lat - fb[i].lat) > 1e-6 || Math.abs(q.lon - fb[i].lon) > 1e-6)) out.push('coords');
  }
  return out;
}

/** Pemeriksa silang untuk satu kunci. phone = bacaan HP (Parsed) atas seluruh PDF. Untuk bagian -a/-b: dibandingkan dengan grup HP
    ke-(huruf akhiran) hanya bila HP menemukan grup sebanyak bagian keluarga itu; selain itu hanya jenis yang dibandingkan
    (titik, koordinat, dan tanggal satu bagian tidak bisa dicocokkan dengan bacaan seluruh PDF). */
function crossCheckPart(S, no, phone) {
  const r = S.pm[no];
  const sfx = suffixOf(no);
  if (!sfx) return crossCheck(r.parsed, phone);
  const base = baseNo(no);
  const parts = Object.keys(S.pm).filter(k => baseNo(k) === base && suffixOf(k)).length;
  const groups = phone.groups || [];
  const g = groups[sfx.charCodeAt(0) - 97];
  if (groups.length === parts && g) return crossCheck(r.parsed, Object.assign({}, phone, { groups: [g] }));
  return r.parsed.kind !== phone.kind ? ['kind'] : [];
}

function setCross(S, no, diffs, now) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  r.cross = { diffs: diffs.slice(), at: now };
  return { ok: true };
}

/** Butuh centang "sudah saya periksa": ada isu terdeteksi atau pembaca HP menemukan beda dari bacaan server. */
function needsAck(S, no) {
  const r = S.pm[no];
  return !!r && (issuesOf(S, no).length > 0 || !!(r.cross && r.cross.diffs.length));
}

/* ----- Setujui ----- */
function approve(S, no, who, now) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  if (r.status !== 'draf' || !r.work) return { ok: false, code: 'not_draft' };
  const is = issuesOf(S, no);
  if (is.some(i => i.block)) return { ok: false, code: 'blocked_no_coords' };
  if (needsAck(S, no) && !r.ack) return { ok: false, code: 'ack_required' };
  r.status = 'disetujui';
  r.approvedBy = who;
  r.approvedAt = now;
  addLog(S, who, 'approve', { no, corrected: r.changes.length > 0 }, now);
  return { ok: true };
}

function unapprove(S, no, who, now) {
  const r = S.pm[no];
  if (!r) return { ok: false, code: 'unknown' };
  if (r.status !== 'disetujui') return { ok: false, code: 'not_approved' };
  r.status = 'draf';
  addLog(S, who, 'unapprove', { no }, now);
  return { ok: true };
}

/* ----- Tambah dari berkas PDF dan tempel koordinat ----- */
/** result = keluaran parsePmnText. opts = {no?, replace?}. */
function addFromPdf(S, result, fileName, who, now, opts) {
  opts = opts || {};
  const no = opts.no || result.no;
  if (!no) return { ok: false, code: 'no_number' };
  const old = S.pm[no];
  let replaced = false;
  if (old && !old.stub) {
    if (LOCKED.includes(old.status) || !opts.replace) return { ok: false, code: 'exists', status: old.status };
    replaced = true;
  }
  const parsed = toParsed(result, `PMN ${no}`);
  const r = blankRecord({ title: parsed.title, published: null, link: null }, 'manual');
  r.status = 'draf';
  r.file = fileName;
  r.parsed = parsed;
  r.work = workFromParsed(parsed);
  r.readBy = who;
  r.ver = old ? old.ver : 0;
  S.pm[no] = r;
  addLog(S, who, 'add_pdf', { no, file: fileName, kind: result.kind }, now);
  return { ok: true, no, replaced };
}

function pasteCoords(S, no, text, who, now) {
  const e = editable(S, no); if (e.err) return e.err;
  const gs = parseCoords(text);
  const n = gs.reduce((a, g) => a + g.pts.length, 0);
  if (!n) return { ok: false, code: 'none' };
  const w = e.r.work;
  for (const g of gs) { g.type = g.pts.length >= 3 ? 'area' : 'points'; w.groups.push(g); }
  if (w.kind === 'check') w.kind = 'plot';
  pushChange(e.r, who, now, { kind: 'coords_paste', old: '', nw: String(n) });
  addLog(S, who, 'paste_coords', { no, n }, now);
  return { ok: true, n };
}

/* ----- Ekspor dan serah terima ----- */
/** Objek lama yang harus dihapus dari ECDIS karena digantikan PMN di `nos`: setiap kunci keluarga nomor yang digantikan
    (137/2026, 137/2026-a, -b, ...) yang sudah diekspor atau terpasang, masing-masing sekali. [{old, new}] */
function ecdisRemovals(S, nos) {
  const out = [], seen = new Set();
  for (const n of nos) {
    const old = S.pm[n] && S.pm[n].work && S.pm[n].work.supersedes;
    if (!old) continue;
    for (const k of sortDesc(Object.keys(S.pm).filter(k => baseNo(k) === old))) {
      if (seen.has(k) || !LOCKED.includes(S.pm[k].status)) continue;
      seen.add(k);
      out.push({ old: k, new: n });
    }
  }
  return out;
}

function makeExport(S, who, now, today) {
  const list = nosByStatus(S, 'disetujui');
  if (!list.length) return { ok: false, code: 'nothing' };
  const top = list[0];
  const removeFromEcdis = ecdisRemovals(S, list);
  const exp = { no: top, by: who, at: now, list, files: exportNames(today, numOf(top)), removeFromEcdis, step: 0 };
  for (const n of list) S.pm[n].status = 'diekspor';
  S.lastExport = exp;
  addLog(S, who, 'export', { n: list.length, top }, now);
  return { ok: true, export: exp };
}

function confirmInstalled(S, who, now) {
  const waiting = nosByStatus(S, 'diekspor');
  if (!waiting.length) return { ok: false, code: 'nothing' };
  for (const n of waiting) S.pm[n].status = 'terpasang';
  const no = S.lastExport ? S.lastExport.no : waiting[0];
  S.lastInstalled = { no, by: who, at: now, list: waiting };
  addLog(S, who, 'installed', { no }, now);
  return { ok: true };
}

/** Satu langkah panduan ekspor selesai (1 simpan ke flashdisk, 2 salin ke ECDIS, 3 cek di ECDIS, 4 salin ke komputer). Langkah ke-4 memasang. */
function exportStepDone(S, who, now) {
  if (!S.lastExport || !nosByStatus(S, 'diekspor').length) return { ok: false, code: 'nothing' };
  const step = (S.lastExport.step || 0) + 1;
  S.lastExport = Object.assign({}, S.lastExport, { step });
  if (step < EXPORT_STEPS) return { ok: true, done: false };
  const r = confirmInstalled(S, who, now);
  return r.ok ? { ok: true, done: true } : r;
}

function exportCounts(S) {
  return { ready: nosByStatus(S, 'disetujui').length, waiting: nosByStatus(S, 'diekspor').length };
}

/* ---- app/sync.js ---- */
/* ===== Sinkronisasi klien-server: tarik, dorong per-PMN dengan versi, antrean offline, konflik ===== */

const OUTBOX_KEY = 'pmn-outbox';
const SYNCED_KEY = 'pmn-synced';
const META_KEYS = ['lastCheck', 'lastCheckOk', 'lastExport', 'lastInstalled'];

/**
 * api: antarmuka API (stub atau backend). storage: {getItem, setItem}. now: () => ISO.
 * push/flush mengembalikan {conflicts:string[], queued|sent, ...}; tidak pernah menimpa diam-diam: konflik mengganti record lokal dengan milik server.
 */
function createSync({ api, storage, now }) {
  const clone = o => JSON.parse(JSON.stringify(o));
  const strip = r => { const c = clone(r); delete c.ver; return JSON.stringify(c); };
  const hash = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return h.toString(16) + ':' + str.length; };
  const sig = r => hash(strip(r));
  // Tanda "sudah terkirim" disimpan bersama cache: setelah muat ulang, record yang sudah sinkron tidak dianggap suntingan lokal.
  let loaded = {};
  try { loaded = JSON.parse(storage.getItem(SYNCED_KEY) || '{}') || {}; } catch (e) { loaded = {}; }
  const synced = {};
  for (const k of Object.keys(loaded)) if (k !== '__meta') synced[k] = loaded[k];
  let syncedMeta = typeof loaded.__meta === 'string' ? loaded.__meta : null;
  const saveSynced = () => { try { storage.setItem(SYNCED_KEY, JSON.stringify(Object.assign({}, synced, { __meta: syncedMeta }))); } catch (e) { /* abaikan */ } };
  const sentLog = new Set();
  const logKey = e => `${e.at}|${e.who}|${e.code}|${JSON.stringify(e.params)}`;
  const metaOf = S => { const m = {}; for (const k of META_KEYS) m[k] = S[k]; return m; };
  // Semua operasi jaringan berjalan satu per satu: dorongan yang tumpang tindih saling bertabrakan menjadi konflik palsu.
  let chain = Promise.resolve();
  const serial = fn => { const p = chain.then(fn); chain = p.catch(() => {}); return p; };
  const dirty = (S, no) => synced[no] !== sig(S.pm[no]);
  const loadBox = () => { try { return JSON.parse(storage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { return []; } };
  const saveBox = b => storage.setItem(OUTBOX_KEY, JSON.stringify(b));

  function queue(entry) {
    const box = loadBox();
    entry.queuedAt = now();
    const same = e => e.type === entry.type && (entry.type === 'meta' || (entry.type === 'pmn' && e.no === entry.no));
    const i = entry.type === 'log' ? -1 : box.findIndex(same);
    if (i >= 0) { if (entry.type === 'pmn') entry.baseVer = box[i].baseVer; box[i] = entry; } else box.push(entry);
    saveBox(box);
  }

  function resolveConflict(S, no, res, conflicts) {
    if (res.record) {
      S.pm[no] = clone(res.record);
      synced[no] = sig(S.pm[no]);
      conflicts.push(no);
    } else if (S.pm[no]) {
      S.pm[no].ver = 0; // server belum punya record ini: tulis ulang dari nol pada dorongan berikutnya
    }
  }

  function doPull(S) {
    return api.getState().then(st => {
      // dievaluasi SETELAH jawaban server tiba: suntingan yang dibuat selama menunggu jangan hilang
      const keep = {};
      for (const no of Object.keys(S.pm)) if (dirty(S, no)) keep[no] = S.pm[no];
      const localMetaDirty = syncedMeta !== null && JSON.stringify(metaOf(S)) !== syncedMeta;
      const localMeta = metaOf(S);
      const unsent = S.log.filter(l => !sentLog.has(logKey(l)));
      S.pm = clone(st.pmns);
      for (const no of Object.keys(S.pm)) synced[no] = sig(S.pm[no]);
      for (const no of Object.keys(keep)) S.pm[no] = keep[no];
      S.log = unsent.concat(clone(st.log));
      for (const k of META_KEYS) S[k] = st.meta[k] == null ? null : st.meta[k];
      syncedMeta = JSON.stringify(metaOf(S));
      if (localMetaDirty) for (const k of META_KEYS) S[k] = localMeta[k];
      for (const l of st.log) sentLog.add(logKey(l));
      for (const e of loadBox()) {
        if (e.type === 'pmn') { S.pm[e.no] = clone(e.record); S.pm[e.no].ver = e.baseVer; }
        else if (e.type === 'meta') Object.assign(S, e.patch);
        else if (e.type === 'log' && !S.log.some(l => logKey(l) === logKey(e.event))) S.log.unshift(clone(e.event));
      }
      return { ok: true };
    });
  }
  const pull = S => serial(() => doPull(S).then(r => { saveSynced(); return r; }));

  async function doPush(S) {
    let offline = false, queued = 0;
    const conflicts = [], errors = [];
    for (const no of Object.keys(S.pm)) {
      const rec = S.pm[no];
      const mine = sig(rec); // dijepret SEBELUM kirim: suntingan susulan harus tetap terdeteksi sebagai belum terkirim
      if (synced[no] === mine) continue;
      if (!offline) {
        try {
          const res = await api.putPmn(no, rec, rec.ver);
          if (res.ok) { rec.ver = res.ver; synced[no] = mine; continue; }
          if (res.conflict) { resolveConflict(S, no, res, conflicts); continue; }
          // galat lain dari server (err_server, err_busy, err_too_big, ...): bukan terkirim; tetap di antrean dan dilaporkan
          errors.push({ no, code: res.code || 'err_server' });
          offline = true;
        } catch (e) { offline = true; }
      }
      queue({ type: 'pmn', no, record: clone(rec), baseVer: rec.ver });
      queued++;
    }
    const meta = metaOf(S), ms = JSON.stringify(meta);
    if (ms !== syncedMeta) {
      let ok = false;
      if (!offline) { try { const res = await api.putMeta(meta); ok = !(res && res.ok === false); } catch (e) { offline = true; } }
      if (ok) syncedMeta = ms; else queue({ type: 'meta', patch: meta });
    }
    for (const ev of S.log.filter(l => !sentLog.has(logKey(l))).reverse()) {
      let ok = false;
      if (!offline) { try { const res = await api.addLog(ev); ok = !(res && res.ok === false); } catch (e) { offline = true; } }
      if (!ok) queue({ type: 'log', event: clone(ev) });
      sentLog.add(logKey(ev));
    }
    saveSynced();
    return errors.length ? { conflicts, queued, errors } : { conflicts, queued };
  }

  async function doFlush(S) {
    const box = loadBox();
    const conflicts = [];
    let sent = 0;
    while (box.length) {
      const e = box[0];
      try {
        if (e.type === 'pmn') {
          const res = await api.putPmn(e.no, e.record, e.baseVer);
          if (res.ok) { if (S.pm[e.no]) { S.pm[e.no].ver = res.ver; synced[e.no] = sig(S.pm[e.no]); } }
          else if (res.conflict) {
            if (res.record && strip(res.record) === strip(e.record)) { S.pm[e.no] = clone(res.record); synced[e.no] = sig(res.record); }
            else resolveConflict(S, e.no, res, conflicts);
          } else break; // galat server: biarkan di antrean, jangan dibuang
        } else if (e.type === 'meta') { const res = await api.putMeta(e.patch); if (res && res.ok === false) break; syncedMeta = JSON.stringify(e.patch); }
        else if (e.type === 'log') { const res = await api.addLog(e.event); if (res && res.ok === false) break; }
      } catch (err) { break; }
      box.shift();
      saveBox(box);
      sent++;
    }
    saveSynced();
    return { conflicts, sent, remaining: box.length };
  }

  const push = S => serial(() => doPush(S));
  const flush = S => serial(() => doFlush(S));
  const pending = () => loadBox().length;

  return { pull, push, flush, pending };
}

/* ---- app/stubapi.js ---- */
/* ===== API tiruan: server sederhana di dalam penyimpanan, antarmuka sama dengan backend (Rencana 3) ===== */

const STUB_KEY = 'pmn-stub-server';

/**
 * storage: objek mirip localStorage {getItem, setItem}. opts: {items?: Array<{no,title,published,link}>, texts?: {no: teks PDF}, fail?: string, offline?: boolean}.
 * getPdf mengembalikan {ok, text} untuk nomor yang punya teks (hanya API tiruan); backend sungguhan mengembalikan {ok, base64}.
 * Semua metode mengembalikan Promise dan melempar Error('offline') saat offline.
 */
function createStubApi(storage, opts) {
  opts = opts || {};
  let offline = !!opts.offline;
  let failCode = opts.fail || null;
  let dropNext = false;
  const texts = Object.assign({}, opts.texts || {});
  let queuedItems = (opts.items || []).slice();
  const fresh = () => ({
    pmns: {}, meta: { lastCheck: null, lastCheckOk: null, lastExport: null, lastInstalled: null },
    log: [], pending: queuedItems.splice(0), pdfs: {},
  });
  const load = () => { const r = storage.getItem(STUB_KEY); return r ? JSON.parse(r) : fresh(); };
  const save = d => storage.setItem(STUB_KEY, JSON.stringify(d));
  const guard = () => { if (offline) throw new Error('offline'); };

  return {
    setOffline(v) { offline = !!v; },
    setFail(code) { failCode = code || null; },
    dropNextResponse() { dropNext = true; },
    /** Menambah item yang akan ditemukan pada runCheck berikutnya (dipakai tombol demo). */
    queueItems(items) { const d = load(); d.pending.push(...items); save(d); },
    setText(no, text) { texts[no] = text; },

    async getState() {
      guard();
      const d = load();
      return { pmns: d.pmns, meta: d.meta, log: d.log };
    },

    async putPmn(no, record, baseVer) {
      guard();
      const d = load();
      const cur = d.pmns[no];
      const sv = cur ? cur.ver : 0;
      if (baseVer !== sv) return { ok: false, conflict: true, record: cur || null };
      d.pmns[no] = Object.assign(JSON.parse(JSON.stringify(record)), { ver: sv + 1 });
      save(d);
      if (dropNext) { dropNext = false; throw new Error('respons hilang'); }
      return { ok: true, ver: sv + 1 };
    },

    async putMeta(patch) {
      guard();
      const d = load();
      Object.assign(d.meta, patch);
      save(d);
      return { ok: true };
    },

    async addLog(event) {
      guard();
      const d = load();
      d.log.unshift(event);
      if (d.log.length > 100) d.log.length = 100;
      save(d);
      return { ok: true };
    },

    async runCheck() {
      guard();
      if (failCode) return { ok: false, code: failCode };
      const d = load();
      const items = d.pending.splice(0);
      const added = items.filter(i => !d.pmns[i.no]);
      for (const it of added) {
        d.pmns[it.no] = {
          status: 'menunggu', rss: { title: it.title, published: it.published, link: it.link }, src: 'server',
          parsed: null, work: null, changes: [], reason: '', ack: false, ver: 1,
        };
      }
      const at = new Date().toISOString();
      d.meta.lastCheck = at; d.meta.lastCheckOk = at;
      d.log.unshift({ at, who: 'Server', code: added.length ? 'check_found' : 'check_none', params: added.length ? { n: added.length, nos: added.map(i => i.no) } : {} });
      save(d);
      return { ok: true, added: added.map(i => i.no) };
    },

    async getPdf(no) {
      guard();
      const d = load();
      const base = baseNo(no); // bagian (-a, -b) memakai PDF nomor dasarnya
      if (texts[base] != null) return { ok: true, text: texts[base] };
      return d.pdfs[base] ? { ok: true, base64: d.pdfs[base] } : { ok: false, code: 'no_pdf' };
    },
  };
}

/* ---- app/httpapi.js ---- */
/* ===== API sungguhan: POST text/plain ke backend Apps Script. Antarmuka sama dengan app/stubapi.js ===== */
/* createHttpApi({url, code, officer: string | () => string, fetch}). Jaringan gagal, status bukan 200, atau JSON rusak = Error('offline');
   kode akses ditolak = Error('err_auth'). Hasil lain dikembalikan apa adanya. Kode tidak pernah masuk URL. */

function createHttpApi({ url, code, officer, fetch }) {
  async function call(action, args) {
    let res;
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, code, officer: typeof officer === 'function' ? officer() : officer, args }),
      });
      if (!r.ok) throw new Error('offline');
      res = await r.json();
    } catch (e) { throw new Error('offline'); }
    if (res && res.ok === false && res.code === 'err_auth') throw new Error('err_auth');
    return res;
  }
  return {
    getState: () => call('getState', {}),
    putPmn: (no, record, baseVer) => call('putPmn', { no, record, baseVer }),
    putMeta: patch => call('putMeta', { patch }),
    addLog: event => call('addLog', { event }),
    runCheck: () => call('runCheck', {}),
    getPdf: no => call('getPdf', { no }),
  };
}

o:\na) Keep well clear of the working area;\nb) Maintain a proper lookout;\nc) Proceed at a safe speed and navigate with caution;\nd) Maintain a listening watch on VHF Channel 12 (Eastern\nControl); and Communicate with Eastern Control for\nassistance, if required.\nPORT MASTER\nMARITIME AND PORT AUTHORITY OF SINGAPORE\n", "133/2026": "MARITIME AND PORT AUTHORITY OF SINGAPORE\nPORT MARINE NOTICE\nNO.133 OF 2026\n08 Oct 2026\nShipping Community\nHarbour Craft Community\nPleasure Craft Community\nKUSU PILGRIMAGE SEASON 2026\nApplicable to: Mariners operating to and from Marina South Pier (MSP), in the vicinity of East\nKeppel Fairway and Kusu Island (Pulau Tembakul)\n1. The 2026 Kusu Pilgrimage season will commence on 10 Oct 2026 and end on 08 Nov\n2026. During this period, ferries carrying passengers operated by Singapore Island Cruise\n& Ferry Services Pte Ltd (appointed ferry operator) are allowed to ferry passengers to\nKusu Island and berth at the main jetty. The ferries will cross East Keppel Fairway when\nplying between the Marina South Pier (MSP) and Kusu Island (Pulau Tembakul). The\nrecommended routes for these ferries are shown in Appendix 1. Mariners shall keep a\nproper lookout for these ferries and navigate with extra caution when in the vicinity of the\nrecommended routes.\n2. The traffic movement within MSP has been divided in two routes. All ferries and harbour\ncraft shall use the recommended routes as indicated by the chartlet in Appendix 2. The\nwaters within the breakwater MSP are “no wake zone”, harbour craft and ferries operating\nwithin the waters of MSP are reminded to slow down as far as practicable to reduce\ncausing wakes.\n3. Master of ferries, harbour and pleasure craft shall proceed at a safe speed and navigate\nwith caution when approaching MSP and Kusu Island jetties.\n4. The following buoys were laid to aid in the safe navigation of ferries approaching and\nleaving Kusu Jetty. Ferries shall keep within the channel demarcated by the Kusu Buoy\n(Fl (2) R10s) and the yellow polyethylene channel buoys shown in Appendix 3.\n5 Pulau Tembakul (harbour craft jetty) at Kusu is closed for maintenance and no craft\nare allowed to berth at the jetty till further notice. Craft navigating in the vicinity is to\nproceed at safe speed and not cause any excessive wakes.\nWGS 84 Datum\nName Latitude (N) Longitude (E) Purpose Type of Buoy\nKusu Buoy 01° 13.234' 103° 51.692' Port hand buoy Red Can buoy Fl (2)\nR10s\nKusu Marker A 01° 13.521' 103° 51.428' Channel buoy Yellow polyethylene\nbuoy\nKusu Marker B 01° 13.403' 103° 51.435' For mooring of ferries Yellow polyethylene\n(Off Pulau Sakijang) buoy\nCentre (MSCC) Duty Officer at (65) 6325 – 2488 / 2489 for clarification on this\nPort Marine Notice.\nPORT MASTER\nMARITIME AND PORT AUTHORITY OF SINGAPORE\n", "134/2026": "MARITIME AND PORT AUTHORITY OF SINGAPORE\nPORT MARINE NOTICE\nNO. 134 OF 2026\n9 Oct 2026\nShipping Community\nHarbour Craft Community\nPleasure Craft Community\nMAINTENANCE DREDGING WORKS AT TUAS SOUTH STAGING GROUND\nApplicable to: Mariners operating in the vicinity of Tuas South Staging Ground\nDate : With effect from 09 October 2026 to 09 April 2027.\nLocation : At sea, within the working area bounded by the following coordinates (see\nattached chartlet):\n(WGS 84 Datum)\nWorking Area A\nPoint Latitude (N) Longitude (E)\n1 01°17.952’ 103°37.114’\n2 01°17.940’ 103°37.109’\n3 01°17.927’ 103°37.145’\n4 01°17.939’ 103°37.149’\nWorking Area B\nPoint Latitude (N) Longitude (E)\n1 01°17.929’ 103°37.105’\n2 01°17.916’ 103°37.101’\n3 01°17.903’ 103°37.136’\n4 01°17.915’ 103°37.141’\nWorking : 24 hours daily, including Sundays and public holidays.\nHours\nCraft: Name of Craft Harbour Craft Description\nLicence No.\nSTL H17 R 3618H HOPPER BARGE\nSTL H18 SR 3614E HOPPER BARGE\nSTL PT2 ST 1533A TUG BOAT\nThese craft will exhibit the appropriate local and international day and night\nsignals.\nDetails : The maintenance dredging works are intended to remove h /* ===== Pembaca PDF: pengelompokan baris (murni, diuji di Node) dan pemuat pdf.js (browser) ===== */

const PDFJS_VERSION = '3.11.174';
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/`;

/**
 * items = Array<{str, x, y, w}> dari satu halaman. Mengelompokkan item pada baris yang selisih y < 2,5,
 * mengurutkan y menurun lalu x naik, menyisipkan spasi bila celah x > 1,2, dan membuang baris kosong.
 */
function itemsToLines(items) {
  const rows = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    let row = rows.find(r => Math.abs(r.y - it.y) < 2.5);
    if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  }
  rows.sort((a, b) => b.y - a.y);
  const lines = [];
  for (const r of rows) {
    r.items.sort((a, b) => a.x - b.x);
    let line = '', end = null;
    for (const it of r.items) {
      if (end != null && it.x - end > 1.2 && !/\s$/.test(line)) line += ' ';
      line += it.str;
      end = it.x + (it.w || 0);
    }
    line = line.replace(/\s+/g, ' ').trim();
    if (line) lines.push(line);
  }
  return lines;
}

let pdfjsPromise = null;
function loadPdfjs() {
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PDFJS_BASE + 'pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; resolve(pdfjsLib); };
    s.onerror = () => { pdfjsPromise = null; reject(new Error('pdf_js_load')); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}

/** Membaca seluruh halaman sebuah berkas PDF menjadi teks (baris dipisah \n). Hanya jalan di browser. */
async function readPdfFile(file) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    const items = tc.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0 }));
    out.push(...itemsToLines(items));
  }
  return out.join('\n');
}

/* ===== Tampilan: pembantu bersama. Fungsi murni yang mengembalikan string HTML; ctx = {S, t, tn, fmtDate, now, today, officer, ...} ===== */

const HTML_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => HTML_ESC[c]);
const chip = (kind, text) => `<span class="chip ${kind}">${esc(text)}</span>`;

/** Instan ISO -> {date:'YYYY-MM-DD', hhmm:'HH:MM'} di Asia/Singapore. */
function sgtParts(iso) {
  const d = new Date(new Date(iso).getTime() + 8 * 3600e3), p = n => String(n).padStart(2, '0');
  return { date: d.toISOString().slice(0, 10), hhmm: `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}` };
}

/** "hari ini 12:00" atau "12 Okt 2026 12:00". */
function fmtWhen(ctx, iso) {
  const p = sgtParts(iso);
  return p.date === ctx.today ? `${ctx.t('common.today')} ${p.hhmm}` : `${ctx.fmtDate(p.date)} ${p.hhmm}`;
}

const TIME_CHIP = { superseded: 'ganti', unread: 'info', info: 'info', dates_unknown: 'warn', upcoming: 'soon', active: 'ok', ending_soon: 'warn', expired: 'exp' };
const WORK_CHIP = { menunggu: 'info', draf: 'warn', disetujui: 'ok2', diekspor: 'ok2', terpasang: 'ok' };

function timeChip(ctx, no) {
  const ts = timeStatusOf(ctx.S, no, ctx.today);
  return chip(TIME_CHIP[ts.code], ts.code === 'ending_soon' ? ctx.tn('time.ending_soon', ts.days) : ctx.t('time.' + ts.code));
}
const workChip = (ctx, status) => chip(WORK_CHIP[status], ctx.t('work.' + status));

/** Hanya tautan http(s) absolut yang boleh menjadi href (menolak javascript:, data:, dan //host). Selain itu string kosong. */
const safeHttpUrl = u => (/^https?:\/\/[^\s]+$/i.test(String(u == null ? '' : u)) ? String(u) : '');
const countPts = w => (w && w.groups ? w.groups : []).reduce((n, g) => n + g.pts.length, 0);
const wantsGeo = w => !!w && (w.kind === 'plot' || w.kind === 'check');

/** Nomor saja, tanpa tahun, masing-masing sekali: ['137/2026-a', '137/2026-b', '12/2026'] -> "137, 12". */
const numList = nos => [...new Set((nos || []).map(n => String(n).split('/')[0]))].join(', ');

/** Satu baris riwayat/log -> teks pada bahasa aktif. */
function logText(ctx, e) {
  const p = Object.assign({}, e.params);
  let key = 'log.' + e.code;
  if (e.code === 'approve' && p.corrected) key = 'log.approve_corrected';
  if (e.code === 'check_found') p.list = numList(p.nos);
  if (e.code === 'reread') {
    p.was = (p.was || []).join(', '); p.keys = (p.keys || []).join(', ');
    if (e.params && e.params.layout_changed) key = 'log.reread_layout';
  }
  if (e.code === 'check_failed') p.reason = ctx.t('err.' + p.reason);
  if (e.code === 'set_shape') p.type = ctx.t('shape.' + p.type);
  return ctx.t(key, p);
}

/** Kartu PMN untuk daftar. */
function itemHtml(ctx, no) {
  const r = ctx.S.pm[no], w = r.work;
  const when = r.rss && r.rss.published ? ctx.t('list.published', { date: ctx.fmtDate(r.rss.published) }) : ctx.t('list.manual');
  const valid = w && w.from ? ' · ' + ctx.t('list.valid', { from: ctx.fmtDate(w.from), to: ctx.fmtDate(w.to) }) : '';
  const unseen = ctx.officer && !r.stub && !['diekspor', 'terpasang'].includes(r.status) && !(r.seen && r.seen[ctx.officer]) ? `<div style="margin-top:4px">${chip('bad', ctx.t('list.unseen'))}</div>` : '';
  const title = w ? w.title : (r.rss && r.rss.title) || '';
  return `<button class="item" data-act="open" data-no="${esc(no)}"><div class="row sp"><span class="no">PMN ${esc(no)}</span>` +
    `<span class="row wrap">${r.changes && r.changes.length ? chip('warn', ctx.t('common.corrected')) : ''}${timeChip(ctx, no)}${workChip(ctx, r.status)}</span></div>` +
    `<div class="t">${esc(title)}</div><div class="small muted">${esc(when)}${esc(valid)}</div>${unseen}</button>`;
}

function renderHome(ctx) {
  const { S, t, tn } = ctx;
  const st = staleness(S, ctx.now);
  const pend = nosByStatus(S, 'menunggu'), draf = nosByStatus(S, 'draf'), ready = nosByStatus(S, 'disetujui'), waiting = nosByStatus(S, 'diekspor');
  let h = '';
  if (ctx.busy) h += `<div class="card act"><div class="big">${esc(ctx.busy)}</div><div class="small muted">${esc(t('home.reading_hint'))}</div></div>`;

  const when = S.lastCheckOk ? fmtWhen(ctx, S.lastCheckOk) : t('home.never');
  h += `<div class="card ${st.stale ? 'bad' : 'ok'}"><div class="row sp"><div><div class="small muted">${esc(t('home.check_note'))}</div>` +
    `<div class="big">${st.stale ? '⚠ ' : '✓ '}${esc(t('home.last_ok', { when }))}</div>` +
    (st.stale ? `<div class="small" style="margin-top:4px">${esc(t('home.stale'))}</div>` : '') +
    `</div><button class="btn ghost sm" data-act="check">${esc(t('home.check_now'))}</button></div></div>`;

  h += `<div class="card"><h2>${esc(t('home.handover'))}</h2>`;
  if (S.lastInstalled) {
    h += `<div class="big">${esc(t('home.installed_up_to', { no: S.lastInstalled.no }))}</div><div class="small muted">${esc(t('home.last_update_meta', { date: ctx.fmtDate(sgtParts(S.lastInstalled.at).date), by: S.lastInstalled.by }))}</div>`;
  } else h += `<div class="muted">${esc(t('home.no_handover'))}</div>`;
  if (waiting.length && S.lastExport) h += `<div class="small" style="margin-top:6px;color:var(--warn)">⏳ ${esc(t('home.export_waiting', { no: S.lastExport.no, by: S.lastExport.by }))}</div>`;
  h += `</div>`;

  if (ctx.reading) h += `<div class="card act"><div class="big">${esc(t('home.reading', { no: ctx.reading }))}</div></div>`;
  if (pend.length && !ctx.reading) {
    h += `<div class="card act"><div class="big">${esc(tn('home.pending', pend.length))}</div>` +
      `<div class="small muted">${esc(t('home.pending_list', { list: numList(pend) }))}</div>` +
      `<div style="margin-top:8px"><button class="btn" data-act="readAll">${esc(t('home.read_all'))}</button></div></div>`;
  }
  if (draf.length) {
    h += `<div class="card warn"><div class="big">${esc(tn('home.drafts', draf.length))}</div><div class="small muted">${esc(t('home.drafts_hint'))}</div>` +
      draf.map(n => itemHtml(ctx, n)).join('') + `</div>`;
  }
  if (ready.length) {
    h += `<div class="card act"><div class="big">${esc(tn('home.ready', ready.length))}</div>` +
      `<div style="margin-top:8px"><button class="btn" data-act="tab" data-no="export">${esc(t('home.go_export'))}</button></div></div>`;
  }
  if (!pend.length && !draf.length && !ready.length && !waiting.length) {
    h += `<div class="card"><div class="big">${esc(t('home.all_clear'))}</div><div class="small muted">${esc(t('home.all_clear_hint'))}</div></div>`;
  }
  return h;
}

const LOCKED_STATUS = ['diekspor', 'terpasang'];
const detailShapes = ['area', 'points', 'circles'];

function trailHtml(ctx, r) {
  const { t } = ctx;
  const s = x => `<span class="s">${esc(x)}</span>`, m = x => `<span class="m">${esc(x)}</span>`, a = '<span class="a">→</span>';
  if (r.src === 'manual') return `<div class="trail">${m(t('detail.trail_manual'))}${a}${s(t('detail.trail_pdf_read', { file: r.file || '' }))}${a}${s(t('detail.trail_draft'))}</div>`;
  return `<div class="trail">${s(t('detail.trail_rss'))}${a}${s(t('detail.trail_page'))}${a}${s(t('detail.trail_pdf'))}${a}` +
    (r.work ? s(r.parsed && r.parsed.reader === 'claude' ? t('detail.trail_read_claude') : r.parsed && r.parsed.reader === 'ocr' ? t('detail.trail_read_ocr') : t('detail.trail_read_by', { who: r.readBy || '—' })) : m(t('detail.trail_unread'))) + '</div>';
}

function pointRow(ctx, no, r, gi, pi, q, flagged, ui, locked) {
  const { t } = ctx;
  const og = r.parsed && r.parsed.groups[gi], o = og && og.pts.find(p => p.label === q.label);
  const changed = !o || o.lat !== q.lat || o.lon !== q.lon;
  const editing = !locked && ui.editRow && ui.editRow.gi === gi && ui.editRow.pi === pi;
  const at = `data-no="${esc(no)}" data-g="${gi}" data-p="${pi}"`;
  if (editing) {
    const raw = (v, hemi) => v.replace(/[°']/g, ' ').replace(hemi, '').trim();
    return `<tr><td>${esc(q.label)}</td><td colspan="2"><input class="in pt" id="e-lat" value="${esc(raw(q.latDM, /[NS]/))}"> <input class="in pt" id="e-lon" value="${esc(raw(q.lonDM, /[EW]/))}"></td>` +
      `<td><button class="btn sm okb" data-act="savept" ${at}>${esc(t('common.save'))}</button> <button class="btn ghost sm" data-act="cancelpt">${esc(t('common.cancel'))}</button></td></tr>`;
  }
  const note = changed ? (o ? `<div class="small muted">${esc(t('detail.orig', { value: `${o.latDM} ${o.lonDM}` }))}</div>` : `<div class="small muted">${esc(t('detail.added_point'))}</div>`) : '';
  const btns = locked ? '' : `<button class="btn ghost sm" data-act="editpt" ${at}>${flagged ? '⚠ ' : ''}${esc(t('common.change'))}</button> ` +
    `<button class="btn badb sm" data-act="delpt" ${at} title="${esc(t('common.delete'))}">✕</button>` +
    (changed && o ? ` <button class="btn ghost sm" data-act="restorept" ${at} title="${esc(t('detail.restore_title'))}">↺</button>` : '');
  return `<tr class="${flagged ? 'flag' : (changed ? 'edited' : '')}"><td>${esc(q.label)}</td><td>${esc(q.latDM)}</td><td>${esc(q.lonDM)}${note}</td><td style="white-space:nowrap">${btns}</td></tr>`;
}

  }
  b += pdfHtml;

    if (r.status === 'draf' && r.parsed && r.parsed.reader === 'claude') b += `<div class="card warn small">${esc(t('detail.claude_note'))}</div>`;

    if (wasInstalled.length) b += `<div class="card warn small">${esc(t('detail.reread_installed', { list: wasInstalled.map(x => `${x.no} (${t('work.' + x.status)})`).join(', ') }))}</div>`;

      if (needsAck(S, no) && !blocked) b += `<label class="ck"><input type="checkbox" data-act="ack" data-no="${esc(no)}" ${r.ack ? 'checked' : ''}> ${esc(t('detail.ack'))}</label>`;

        `<button class="btn ghost" data-act="reread" data-no="${esc(no)}">${esc(t('detail.reread'))}</button>`;
    } else if (r.status === 'disetujui') foot = `<button class="btn ghost" data-act="unapprove" data-no="${esc(no)}">${esc(t('detail.unapprove'))}</button>`;
    else if (locked) b += `<div class="card small">${esc(t('err.locked'))}</div>`;
  }
  if (r.rss && safeHttpUrl(r.rss.link)) b += `<p class="small"><a href="${esc(safeHttpUrl(r.rss.link))}" target="_blank" rel="noopener">${esc(t('detail.open_mpa'))}</a></p>`;
  b += `<div class="disc">${esc(t('disclaimer.map'))}</div>`;
  return `<div class="sheet"><div class="bar"><b>${esc(t('detail.bar', { no }))}</b><button class="btn ghost sm" data-act="close">${esc(t('common.close'))}</button></div>` +
    `<div class="body">${b}</div>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}
