        if(!master||master.getElementsByTagNameNS(NS_M,'f')[0].textContent!==bakuF(mrow)){skipped.push({no:rm.no,reason:'formula'});continue}
        for(const k of cells)setF(d,k,bakuF(+k.getAttribute('r').replace(/\D/g,'')),true);
      }else if(!bakuRe(rn).test(f.textContent)){skipped.push({no:rm.no,reason:'formula'});continue}
    }else{
      const v=cellVal(c,x.ss);

      if(v!=null&&v!==''){skipped.push({no:rm.no,reason:'manual'});continue}

/** New year: copy the latest year sheet's header (rows 1-9) and column layout into a fresh sheet. */

  for(const r of [...sd.getElementsByTagNameNS(NS_M,'row')])if(+r.getAttribute('r')>=10)sd.removeChild(r);
  for(const tg of ['drawing','legacyDrawing','conditionalFormatting','hyperlinks'])for(const e of [...d.getElementsByTagNameNS(NS_M,tg)])e.parentNode.removeChild(e);

  r.setAttribute('Id','rId'+rid);r.setAttribute('Type',NS_R+'/worksheet');r.setAttribute('Target',`worksheets/sheet${n}.xml`);rel.documentElement.appendChild(r);
  const o=ct.createElementNS('http://schemas.openxmlformats.org/package/2006/content-types','Override');
  o.setAttribute('PartName','/'+path);o.setAttribute('ContentType','application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml');ct.documentElement.appendChild(o);
  const sheetsEl=wb.getElementsByTagNameNS(NS_M,'sheets')[0];
  const maxId=Math.max(...[...sheetsEl.getElementsByTagNameNS(NS_M,'sheet')].map(s=>+s.getAttribute('sheetId')));
  const s=wb.createElementNS(NS_M,'sheet');s.setAttribute('name',year);s.setAttribute('sheetId',maxId+1);s.setAttributeNS(NS_R,'r:id','rId'+rid);sheetsEl.appendChild(s);

/* ---- app/exportfiles.js ---- */
/* ===== Berkas ekspor: user chart ECDIS (XML Furuno), daftar PDF untuk ZIP, baris Excel PMN RECORD ===== */
/* Fungsi murni tanpa DOM. Aturan objek persis v1 (src/app.js: newObjects, extrasFor, objXml, buildXml).
   Bergantung pada global baseNo, ecdisName, sortDesc (shared/rules.js). Nama tingkat atas berawalan ex supaya tidak bentrok di bundel. */

const EX_MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const EX_VERSIONS = ['1.0', '1.1', '1.2'];
const EX_CHART_NAME = 'Singapore PMN';
/** Radius lingkaran terkecil yang diterima impor ECDIS (NM). Pada uji 24 Okt 2026 range 0.053996 (100 m) ditolak, 0.121490 diterima; semua lingkaran di user chart asli kapal >= 0.1. */
const EX_MIN_RANGE_NM = 0.1;
const EX_GROUP_COMMENT = { areas: 'userchart area', labels: 'userchart label', circles: 'userchart circle' };
const EX_CTRL = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\uFFFE\uFFFF]/g;
const EX_FOLD = [[/[\u2018\u2019\u201A\u201B\u2032\u00B4\u0060]/g, "'"], [/[\u201C\u201D\u201E\u201F\u2033]/g, '"'], [/[\u2010-\u2015\u2212]/g, '-'], [/[\u00B0\u00BA\u02DA]/g, ' '], [/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g, ' ']];

/** "2026-03-05" -> "05 MAR 2026"; kosong -> "-". */
const exDateU = iso => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]} ${EX_MON[+m[2] - 1]} ${m[1]}` : '-';
};
/** Escape nilai atribut XML; baris baru menjadi &#10; (seperti ECDIS). */
const exEsc = s => String(s == null ? '' : s).replace(EX_CTRL, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/\r?\n/g, '&#10;');
/** Teks untuk ECDIS: hanya ASCII (user chart kapal tidak memuat huruf lain). Tanda kutip, pisah, derajat, spasi khusus dipetakan; huruf beraksen tanpa aksen; sisanya dibuang. */
function exAscii(s) {
  let out = String(s == null ? '' : s).replace(EX_CTRL, '');
  for (const [re, to] of EX_FOLD) out = out.replace(re, to);
  return out.normalize('NFKD').replace(/[^\x09\x0A\x0D\x20-\x7E]/g, '');
}
/** Radius (m) yang sah: angka > 0, selain itu null. */
const exRadius = v => (typeof v === 'number' && isFinite(v) && v > 0 ? v : null);
/** Nama berkas aman untuk Windows/Android/iOS. */
const exSafeName = s => String(s || '').replace(EX_CTRL, '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();

/** Nomor (bagian) yang diekspor, urut menurun, hanya yang punya nilai kerja. */
const exNos = (S, nos) => sortDesc((nos || []).filter(n => S.pm[n] && S.pm[n].work));
const exTitle = r => (r.work && r.work.title) || (r.rss && r.rss.title) || '';

function exDesc(no, w) {
  return [`PMN ${baseNo(no)}`, '', `FROM ${exDateU(w.from)} TO ${exDateU(w.to)}`, '', (w.title || '').toUpperCase(),
    [w.hours, w.vhf].filter(Boolean).join(' - ').toUpperCase()].join('\n').trim();
}

/** Objek user chart untuk satu PMN (bagian): area (>=3 titik), label per titik (tipe points atau <3 titik), circle per titik (tipe circles). */
function exObjects(no, w) {
  if (!w || w.kind !== 'plot') return [];
  const desc = exAscii(exDesc(no, w)), name = ecdisName(no);
  const type = [['checkDanger', '1'], ['displayRadar', '1'], ['hasNotes', '0'], ['notesType', '0']], disp = [['S52colorcode', 'CHRED'], ['lineWidth', '2'], ['density', '25']];
  const groups = (w.groups || []).filter(g => g.pts && g.pts.length), multi = groups.length > 1, out = [];
  groups.forEach((g, gi) => {
    const tail = String(g.name || '').replace(/^Area\s*/i, '').trim();
    const gs = multi ? ' ' + (tail || String.fromCharCode(65 + gi)) : '';
    if (g.type === 'circles') g.pts.forEach(x => out.push({ kind: 'circle', group: 'circles', attrs: [['name', `${name}-${x.label}`], ['description', desc]], verts: [[x.lat, x.lon]],
      extras: [{ tag: 'attribute', attrs: [['range', Math.max((exRadius(x.r) || exRadius(w.radius) || 100) / 1852, EX_MIN_RANGE_NM).toFixed(6)]] }, { tag: 'type', attrs: type }, { tag: 'display', attrs: disp }] }));
    else if (g.type === 'points' || g.pts.length < 3) g.pts.forEach(x => out.push({ kind: 'label', group: 'labels', attrs: [['name', `${name} ${x.label}`], ['description', desc]], verts: [[x.lat, x.lon]],
      extras: [{ tag: 'attribute', attrs: [['labelStyle', '3'], ['labelText', x.label]] }, { tag: 'type', attrs: [['checkDanger', '1'], ['displayRadar', '1']] }, { tag: 'display', attrs: [['S52colorcode', 'CHRED']] }] }));
    else out.push({ kind: 'area', group: 'areas', attrs: [['name', name + gs], ['description', desc]], verts: g.pts.map(x => [x.lat, x.lon]), extras: [{ tag: 'type', attrs: type }, { tag: 'display', attrs: disp }] });
  });
  // nama dan teks label juga hanya ASCII
  out.forEach(o => { o.attrs = o.attrs.map(([k, v]) => [k, exAscii(v)]); o.extras.forEach(e => { e.attrs = e.attrs.map(([k, v]) => [k, k === 'labelText' ? exAscii(v) : v]); }); });
  return out;
}

/** Elemen tambahan per versi: 1.0 tanpa display dan labelStyle 1; 1.1 dengan display; 1.2 ditambah linkedDocument="". */
function exExtras(o, ver) {
  let ex = o.extras.map(e => ({ tag: e.tag, attrs: e.attrs.map(a => a.slice()) }));
  const get = t => ex.find(e => e.tag === t);
  if (ver !== '1.2') {
    ex.forEach(e => { if (e.tag === 'attribute') e.attrs = e.attrs.filter(a => a[0] !== 'linkedDocument'); });
    ex = ex.filter(e => !(e.tag === 'attribute' && !e.attrs.length));
  }
  if (ver === '1.0') { ex = ex.filter(e => e.tag !== 'display'); ex.forEach(e => e.attrs.forEach(a => { if (a[0] === 'labelStyle') a[1] = '1'; })); }
  else if (!get('display')) ex.push({ tag: 'display', attrs: o.kind === 'label' ? [['S52colorcode', 'CHRED']] : [['S52colorcode', 'CHRED'], ['lineWidth', '2'], ['density', '25']] });
  if (ver === '1.2') {
    let at = get('attribute');
    if (!at) { at = { tag: 'attribute', attrs: [] }; ex.push(at); }
    if (!at.attrs.some(a => a[0] === 'linkedDocument')) at.attrs.push(['linkedDocument', '']);
  }
  const order = ['attribute', 'type', 'display'], rk = t => { const i = order.indexOf(t); return i < 0 ? 9 : i; };
  return ex.sort((a, b) => rk(a.tag) - rk(b.tag));
}

function exObjXml(o, ver) {
  const at = a => a.map(([k, v]) => ` ${k}="${exEsc(v)}"`).join('');
  let s = `    <${o.kind}${at(o.attrs)}>\n      <position>\n`;
  o.verts.forEach((v, i) => { s += `        <vertex id="${i + 1}" latitude="${v[0].toFixed(6)}" longitude="${v[1].toFixed(6)}"/>\n`; });
  s += '      </position>\n';
  exExtras(o, ver).forEach(e => { s += `      <${e.tag}${at(e.attrs)}/>\n`; });
  return s + `    </${o.kind}>\n`;
}

/** User chart berisi hanya objek PMN dari `nos` (bukan menimpa seluruh chart kapal). opts: {name='Singapore PMN', ver='1.2'}. */
function exUserChartXml(S, nos, opts) {
  opts = opts || {};
  const ver = EX_VERSIONS.includes(opts.ver) ? opts.ver : '1.2';
  const name = exAscii(String(opts.name || '')).trim() || EX_CHART_NAME;
  const objs = exNos(S, nos).flatMap(n => exObjects(n, S.pm[n].work));
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n<!--userchart node-->\n<userchart name="${exEsc(name)}" description="" version="${ver}">\n`;
  for (const g of ['areas', 'labels', 'circles']) {
    const os = objs.filter(o => o.group === g);
    if (os.length) s += `  <!--${EX_GROUP_COMMENT[g]}-->\n  <${g}>\n` + os.map(o => exObjXml(o, ver)).join('') + `  </${g}>\n`;
  }
  return s + '</userchart>\n';
}

/** Jumlah objek yang akan ditulis ke XML (0 = tidak ada yang tergambar, mis. hanya pengumuman). */
const exObjectCount = (S, nos) => exNos(S, nos).reduce((n, k) => n + exObjects(k, S.pm[k].work).length, 0);

/** Bagian pertama (urut) per nomor induk: [{no: induk, r}]. */
function exByBase(S, nos) {
  const out = [], seen = new Set();
  for (const n of exNos(S, nos)) {
    const b = baseNo(n);
    if (!seen.has(b)) { seen.add(b); out.push({ no: b, r: S.pm[n], parts: exNos(S, nos).filter(k => baseNo(k) === b) }); }
  }
  return out;
}

/** Isi ZIP: satu PDF per nomor induk (bagian -a/-b berbagi satu PDF). [{no, name: "PMN 137-2026 Judul.pdf"}] */
function exPdfEntries(S, nos) {
  return exByBase(S, nos).map(({ no, r }) => {
    const [n, y] = no.split('/');
    return { no, name: exSafeName(`PMN ${String(n).padStart(3, '0')}-${y} ${exTitle(r)}`).slice(0, 110) + '.pdf' };
  });
}

/** Baris baru PMN RECORD (untuk updateRecord): satu per nomor induk; tanggal kosong null; pengumuman tanpa tanggal akhir tanpa tanggal (seperti v1). */
/** Nama berkas Excel yang dibagikan: sama dengan berkas di komputer kapal, supaya tinggal diganti. */
const EX_XLSX_NAME = 'PMN RECORD.xlsx';

function exExcelEntries(S, nos) {
  return exByBase(S, nos).map(({ no, r, parts }) => {
    const ws = parts.map(k => S.pm[k].work), w = r.work;
    const froms = ws.map(x => x.from).filter(Boolean).sort(), tos = ws.map(x => x.to).filter(Boolean).sort();
    const from = froms[0] || null, to = tos.length ? tos[tos.length - 1] : null;
    const none = w.kind === 'advisory' && !to;
    const entry = { no, published: w.published || (r.rss && r.rss.published) || null, title: exTitle(r), from: none ? null : from, to: none ? null : to };
    if (w.supersedes) entry.replaces = w.supersedes; // kunci hanya ada bila PMN ini menggantikan PMN lain
    return entry;
  });
}

/** Remark untuk baris Excel PMN induk yang digantikan salah satu PMN di `nos` (daftar PMN disetujui paket): [{no, text}].
    Termasuk PMN riwayat (stub) yang hanya ada di Excel; draf yang tidak ada di `nos` tidak dihitung. Kedaluwarsa tidak termasuk
    (kolom Remark kapal sudah berisi rumus yang menghasilkan CANCEL). Penggantian tidak bergantung tanggal. */
function exExcelRemarks(S, nos) {
  const keys = Object.keys(S.pm);
  const sup = supersedeMap(nos.filter(k => S.pm[k] && S.pm[k].work).map(k => ({ no: k, supersedes: S.pm[k].work.supersedes })));
  return sortDesc(Object.keys(sup).filter(old => keys.some(k => baseNo(k) === old))).map(old => ({ no: old, text: 'CANCEL - REPLACED BY PMN ' + sup[old] }));
}

/** Nama chart untuk ditampilkan dan dipakai di XML: tanpa karakter kendali, paling panjang 60, kosong -> bawaan. */
const exChartName = s => String(s == null ? '' : s).replace(EX_CTRL, '').replace(/\s+/g, ' ').trim().slice(0, 60) || EX_CHART_NAME;

/* ---- app/views/common.js ---- */
/* ===== Tampilan: pembantu bersama. Fungsi murni yang mengembalikan string HTML; ctx = {S, t, tn, fmtDate, now, today, officer, ...} ===== */

const HTML_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => HTML_ESC[c]);
const chip = (kind, text) => `<span class="chip ${kind}">${esc(text)}</span>`;

/** Instan ISO -> {date:'YYYY-MM-DD', hhmm:'HH:MM'} di Asia/Singapore. */
function sgtParts(iso) {
  const d = new Date(new Date(iso).getTime() + 8 * 3600e3), p = n => String(n).padStart(2, '0');
  return { date: d.toISOString().slice(0, 10), hhmm: `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}` };
}

/** "hari ini 12:00" atau "12 Okt 2026 12:00". */
function fmtWhen(ctx, iso) {
  const p = sgtParts(iso);
  return p.date === ctx.today ? `${ctx.t('common.today')} ${p.hhmm}` : `${ctx.fmtDate(p.date)} ${p.hhmm}`;
}

const TIME_CHIP = { superseded: 'ganti', unread: 'info', info: 'info', dates_unknown: 'warn', upcoming: 'soon', active: 'ok', ending_soon: 'warn', expired: 'exp' };
const WORK_CHIP = { menunggu: 'info', draf: 'warn', disetujui: 'ok2', diekspor: 'ok2', terpasang: 'ok' };

function timeChip(ctx, no) {
  const ts = timeStatusOf(ctx.S, no, ctx.today);
  return chip(TIME_CHIP[ts.code], ts.code === 'ending_soon' ? ctx.tn('time.ending_soon', ts.days) : ctx.t('time.' + ts.code));
}
const workChip = (ctx, status) => chip(WORK_CHIP[status], ctx.t('work.' + status));

/** Chip koreksi: hanya koreksi AI = "dikoreksi AI"; selain itu "koreksi manual"; tanpa perubahan = kosong. */
function correctedChip(ctx, r) {
  const ch = (r && r.changes) || [];
  if (!ch.length) return '';
  return chip('warn', ctx.t(ch.every(c => c.kind === 'point_ai') ? 'common.corrected_ai' : 'common.corrected'));
}

/** Hanya tautan http(s) absolut yang boleh menjadi href (menolak javascript:, data:, dan //host). Selain itu string kosong. */
const safeHttpUrl = u => (/^https?:\/\/[^\s]+$/i.test(String(u == null ? '' : u)) ? String(u) : '');
const countPts = w => (w && w.groups ? w.groups : []).reduce((n, g) => n + g.pts.length, 0);
const wantsGeo = w => !!w && (w.kind === 'plot' || w.kind === 'check');

/** Nomor saja, tanpa tahun, masing-masing sekali: ['137/2026-a', '137/2026-b', '12/2026'] -> "137, 12". */
const numList = nos => [...new Set((nos || []).map(n => String(n).split('/')[0]))].join(', ');

/** Satu baris riwayat/log -> teks pada bahasa aktif. */
function logText(ctx, e) {
  const p = Object.assign({}, e.params);
  let key = 'log.' + e.code;
  if (e.code === 'approve' && p.corrected) key = 'log.approve_corrected';
  if (e.code === 'check_found') p.list = numList(p.nos);
  if (e.code === 'reread') {
    p.was = (p.was || []).join(', '); p.keys = (p.keys || []).join(', ');
    if (e.params && e.params.layout_changed) key = 'log.reread_layout';
  }
  if (e.code === 'check_failed') p.reason = ctx.t('err.' + p.reason);
  if (e.code === 'set_shape') p.type = ctx.t('shape.' + p.type);
  return ctx.t(key, p);
}

/** Batang edit peta (oranye di atas peta): Tambah titik, Setujui plot (hanya PMN draf), Selesai. Aturan setuju sama dengan layar detail:
    nonaktif bila tak ada koordinat; kotak centang periksa tampil bila ada hal bertanda. st = {mapEdit, mapAdd}. */
function renderMapEditBar(ctx, st) {
  const { t, S } = ctx, no = st.mapEdit, r = S.pm[no];
  const draft = !!(r && r.status === 'draf' && r.work);
  const blocked = draft && issuesOf(S, no).some(i => i.block);
  const ack = draft && !blocked && needsAck(S, no)
    ? `<label class="ck"><input type="checkbox" data-act="ack" data-no="${esc(no)}" ${r.ack ? 'checked' : ''}> ${esc(t('detail.ack'))}</label>` : '';
  const approve = draft
    ? `<button class="okb" data-act="approve" data-no="${esc(no)}" ${blocked ? 'disabled' : ''}>${esc(t('map.approve'))}</button>` : '';
  return `<div class="editbar"><b>${esc(t('map.edit_title', { no }))}</b><div class="row">` +
    `<button class="${st.mapAdd ? 'on' : ''}" data-act="mapadd">${esc(st.mapAdd ? t('map.add_active') : t('map.add'))}</button>` +
    `${approve}<button data-act="mapdone">${esc(t('map.done'))}</button></div>${ack}</div>`;
}

/** Kartu PMN untuk daftar. */
function itemHtml(ctx, no) {
  const r = ctx.S.pm[no], w = r.work;
  const when = r.rss && r.rss.published ? ctx.t('list.published', { date: ctx.fmtDate(r.rss.published) }) : ctx.t('list.manual');
  const valid = w && w.from ? ' · ' + (w.to ? ctx.t('list.valid', { from: ctx.fmtDate(w.from), to: ctx.fmtDate(w.to) }) : ctx.t('list.valid_open', { from: ctx.fmtDate(w.from) })) : '';
  const unseen = ctx.officer && !r.stub && !['diekspor', 'terpasang'].includes(r.status) && !(r.seen && r.seen[ctx.officer]) ? `<div style="margin-top:4px">${chip('bad', ctx.t('list.unseen'))}</div>` : '';
  const title = w ? w.title : (r.rss && r.rss.title) || '';
  return `<button class="item" data-act="open" data-no="${esc(no)}"><div class="row sp"><span class="no">PMN ${esc(no)}</span>` +
    `<span class="row wrap">${correctedChip(ctx, r)}${timeChip(ctx, no)}${workChip(ctx, r.status)}</span></div>` +
    `<div class="t">${esc(title)}</div><div class="small muted">${esc(when)}${esc(valid)}</div>${unseen}</button>`;
}

/* ===== Tampilan Beranda ===== */

function renderHome(ctx) {
  const { S, t, tn } = ctx;
  const st = staleness(S, ctx.now);
  const pend = nosByStatus(S, 'menunggu'), draf = nosByStatus(S, 'draf'), ready = nosByStatus(S, 'disetujui'), waiting = nosByStatus(S, 'diekspor');
  let h = '';
  if (ctx.busy) h += `<div class="card act"><div class="big">${esc(ctx.busy)}</div><div class="small muted">${esc(t('home.reading_hint'))}</div></div>`;

  const when = S.lastCheckOk ? fmtWhen(ctx, S.lastCheckOk) : t('home.never');
  h += `<div class="card ${st.stale ? 'bad' : 'ok'}"><div class="row sp"><div><div class="small muted">${esc(t('home.check_note'))}</div>` +
    `<div class="big">${st.stale ? '⚠ ' : '✓ '}${esc(t('home.last_ok', { when }))}</div>` +
    (st.stale ? `<div class="small" style="margin-top:4px">${esc(t('home.stale'))}</div>` : '') +
    `</div><button class="btn ghost sm" data-act="check">${esc(t('home.check_now'))}</button></div></div>`;

  h += `<div class="card"><h2>${esc(t('home.handover'))}</h2>`;
  if (S.lastInstalled) {
    h += `<div class="big">${esc(t('home.installed_up_to', { no: S.lastInstalled.no }))}</div><div class="small muted">${esc(t('home.last_update_meta', { date: ctx.fmtDate(sgtParts(S.lastInstalled.at).date), by: S.lastInstalled.by }))}</div>`;
  } else h += `<div class="muted">${esc(t('home.no_handover'))}</div>`;
  if (waiting.length && S.lastExport) h += `<div class="small" style="margin-top:6px;color:var(--warn)">⏳ ${esc(t('home.export_waiting', { no: exportTopNo(S), by: S.lastExport.by }))}</div>`;
  h += `</div>`;

  if (ctx.reading) h += `<div class="card act"><div class="big">${esc(t('home.reading', { no: ctx.reading }))}</div></div>`;
  if (pend.length && !ctx.reading) {
    h += `<div class="card act"><div class="big">${esc(tn('home.pending', pend.length))}</div>` +
      `<div class="small muted">${esc(t('home.pending_list', { list: numList(pend) }))}</div>` +
      `<div style="margin-top:8px"><button class="btn" data-act="readAll">${esc(t('home.read_all'))}</button></div></div>`;
  }
  if (draf.length) {
    h += `<div class="card warn"><div class="big">${esc(tn('home.drafts', draf.length))}</div><div class="small muted">${esc(t('home.drafts_hint'))}</div>` +
      draf.map(n => itemHtml(ctx, n)).join('') + `</div>`;
  }
  if (ready.length) {
    h += `<div class="card act"><div class="big">${esc(tn('home.ready', ready.length))}</div>` +
      `<div style="margin-top:8px"><button class="btn" data-act="tab" data-no="export">${esc(t('home.go_export'))}</button></div></div>`;
  }
  if (!pend.length && !draf.length && !ready.length && !waiting.length) {
    h += `<div class="card"><div class="big">${esc(t('home.all_clear'))}</div><div class="small muted">${esc(t('home.all_clear_hint'))}</div></div>`;
  }
  return h;
}

function renderList(ctx) {

  const stubs = Object.keys(S.pm).filter(n => S.pm[n].stub).sort((a, b) => numOf(a) - numOf(b));
  const cancelled = all.filter(n => pmnGroup(S, n, ctx.today) === 'dibatalkan'), active = all.filter(n => !cancelled.includes(n));

  const btn = (key, label) => `<button class="seg-b${tab === key ? ' on' : ''}" data-act="listtab" data-no="${key}">${esc(label)}</button>`;
  const shown = tab === 'aktif' ? active : cancelled;
  return `<div class="seg">${btn('aktif', t('list.group_active', { n: active.length }))}${btn('dibatalkan', t('list.group_cancelled', { n: cancelled.length }))}</div>` +
    (shown.length ? shown.map(n => itemHtml(ctx, n)).join('') : `<div class="empty">${esc(t(tab === 'aktif' ? 'list.empty_active' : 'list.empty_cancelled'))}</div>`) +
    (stubs.length ? `<div class="small muted" style="margin:10px 2px">${esc(tn('list.history_note', stubs.length, { list: stubs.map(n => n.split('/')[0]).join(', ') }))}</div>` : '');
}

/* ===== Tampilan detail PMN (lembar penuh) ===== */

const LOCKED_STATUS = ['diekspor', 'terpasang'];
const detailShapes = ['area', 'points', 'circles'];

function trailHtml(ctx, r) {
  const { t } = ctx;
  const s = x => `<span class="s">${esc(x)}</span>`, m = x => `<span class="m">${esc(x)}</span>`, a = '<span class="a">→</span>';
  if (r.src === 'manual') return `<div class="trail">${m(t('detail.trail_manual'))}${a}${s(t('detail.trail_pdf_read', { file: r.file || '' }))}${a}${s(t('detail.trail_draft'))}</div>`;
  return `<div class="trail">${s(t('detail.trail_rss'))}${a}${s(t('detail.trail_page'))}${a}${s(t('detail.trail_pdf'))}${a}` +
    (r.work ? s(r.parsed && r.parsed.reader === 'claude' ? t('detail.trail_read_claude') : r.parsed && r.parsed.reader === 'ocr' ? t('detail.trail_read_ocr') : t('detail.trail_read_by', { who: r.readBy || '—' })) : m(t('detail.trail_unread'))) + '</div>';
}

function pointRow(ctx, no, r, gi, pi, q, flagged, ui, locked) {
  const { t } = ctx;
  const og = r.parsed && r.parsed.groups[gi], o = og && og.pts.find(p => p.label === q.label);
  const changed = !o || o.lat !== q.lat || o.lon !== q.lon;
  const editing = !locked && ui.editRow && ui.editRow.gi === gi && ui.editRow.pi === pi;
  const at = `data-no="${esc(no)}" data-g="${gi}" data-p="${pi}"`;
  if (editing) {
    const raw = (v, hemi) => v.replace(/[°']/g, ' ').replace(hemi, '').trim();
    return `<tr><td>${esc(q.label)}</td><td colspan="2"><input class="in pt" id="e-lat" value="${esc(raw(q.latDM, /[NS]/))}"> <input class="in pt" id="e-lon" value="${esc(raw(q.lonDM, /[EW]/))}"></td>` +
      `<td><button class="btn sm okb" data-act="savept" ${at}>${esc(t('common.save'))}</button> <button class="btn ghost sm" data-act="cancelpt">${esc(t('common.cancel'))}</button></td></tr>`;
  }
  const note = changed ? (o ? `<div class="small muted">${esc(t('detail.orig', { value: `${o.latDM} ${o.lonDM}` }))}</div>` : `<div class="small muted">${esc(t('detail.added_point'))}</div>`) : '';
  const btns = locked ? '' : `<button class="btn ghost sm" data-act="editpt" ${at}>${flagged ? '⚠ ' : ''}${esc(t('common.change'))}</button> ` +
    `<button class="btn badb sm" data-act="delpt" ${at} title="${esc(t('common.delete'))}">✕</button>` +
    (changed && o ? ` <button class="btn ghost sm" data-act="restorept" ${at} title="${esc(t('detail.restore_title'))}">↺</button>` : '');
  return `<tr class="${flagged ? 'flag' : (changed ? 'edited' : '')}"><td>${esc(q.label)}</td><td>${esc(q.latDM)}</td><td>${esc(q.lonDM)}${note}</td><td style="white-space:nowrap">${btns}</td></tr>`;
}

function renderDetail(ctx, no, ui) {
  const { S, t, tn } = ctx;
  ui = ui || { editRow: null, editData: false };
  const r = S.pm[no];
  if (!r) return '';
  const w = r.work, locked = LOCKED_STATUS.includes(r.status);
  let b = `<div class="row wrap" style="margin-bottom:6px">${timeChip(ctx, no)}${workChip(ctx, r.status)}${correctedChip(ctx, r)}</div>`;
  b += `<div class="big">${esc(w ? w.title : (r.rss && r.rss.title) || '')}</div>` + trailHtml(ctx, r);
  let foot = '';
  let pdfHtml = '';
  if (r.src === 'server' && !r.stub) {
    const p = ctx.pdf && ctx.pdf.no === no ? ctx.pdf : null;
    if (!p) pdfHtml = `<div style="margin-bottom:10px"><button class="btn ghost sm" data-act="showpdf" data-no="${esc(no)}">${esc(t('detail.pdf_show'))}</button></div>`;
    else pdfHtml = `<div class="card"><div class="row sp"><b>${esc(t('detail.pdf_title'))}</b><button class="btn ghost sm" data-act="hidepdf">${esc(t('detail.pdf_hide'))}</button></div>` +
      (p.text != null ? `<div class="small muted" style="margin:4px 0">${esc(t('detail.pdf_text_note'))}</div><pre class="pdftext">${esc(p.text)}</pre>`
        : `<div class="pdfbox"><div id="pdfpages" data-b64="${esc(p.base64)}"><div class="small muted">${esc(t('detail.pdf_loading'))}</div></div></div>`) + `</div>`;
  }
  b += pdfHtml;
  const officers = ctx.officers || [];
  if (officers.length && !r.stub) {
    b += `<div class="card small"><b>${esc(t('detail.seen_title'))}</b><div class="row wrap" style="margin-top:4px">` +
      officers.map(o => { const at = r.seen && r.seen[o]; return `<span class="seen ${at ? 'yes' : 'no'}"${at ? ` title="${esc(fmtWhen(ctx, at))}"` : ''}>${at ? '✓' : '✗'} ${esc(o)}</span>`; }).join('') +
      `</div><div class="muted" style="margin-top:4px">${esc(t('detail.seen_hint'))}</div></div>`;
  }
  if (r.cross && r.cross.diffs.length) b += `<div class="card bad small"><b>⚠ ${esc(t('detail.cross_title'))}</b><ul class="notes">${r.cross.diffs.map(d => `<li>${esc(t('cross.' + d))}</li>`).join('')}</ul></div>`;

  if (r.stub) {
    b += `<div class="card small">${esc(t('detail.stub_note'))}${supersededBy(S, no) ? ' ' + esc(t('detail.superseded_by', { no: supersededBy(S, no) })) : ''}</div>`;
  } else if (!w) {
    b += `<div class="card act small">${esc(t('detail.waiting_note'))}</div>`;
    if (r.lastError) b += `<div class="card warn small">${esc(t('detail.auto_failed', { reason: t('err.' + r.lastError) }))}</div>`;
    foot = `<button class="btn" data-act="read" data-no="${esc(no)}">${esc(t('home.read_all'))}</button>`;
  } else {
    const is = issuesOf(S, no);
    if (r.status === 'draf' && r.parsed && r.parsed.reader === 'ocr') b += `<div class="card warn small">${esc(t('detail.ocr_note'))}</div>`;
    if (r.status === 'draf' && r.parsed && r.parsed.reader === 'claude') b += `<div class="card warn small">${esc(t('detail.claude_note'))}</div>`;
    const wasInstalled = r.reread && Array.isArray(r.reread.was) ? r.reread.was.filter(x => x && LOCKED_STATUS.includes(x.status)) : [];
    if (wasInstalled.length) b += `<div class="card warn small">${esc(t('detail.reread_installed', { list: wasInstalled.map(x => `${x.no} (${t('work.' + x.status)})`).join(', ') }))}</div>`;
    const ai = (r.changes || []).filter(c => c.kind === 'point_ai');
    if (ai.length) b += `<div class="card warn small"><b>${esc(t('detail.ai_title'))}</b><div class="muted" style="margin:4px 0">${esc(t('detail.ai_note'))}</div><ul class="notes">${ai.map(c => `<li>${esc(t('detail.ai_row', c))}</li>`).join('')}</ul></div>`;
    const blocked = is.some(i => i.block);
    if (is.length) b += `<div class="card bad small"><b>⚠ ${esc(t('detail.issues_title'))}</b><ul class="notes">${is.map(i => `<li>${esc(t('issue.' + i.code, i))}</li>`).join('')}</ul></div>`;
    const warns = ((r.parsed && r.parsed.warn) || []).filter(x => !is.some(i => i.code === x.code));
    if (warns.length) b += `<div class="card warn small"><b>${esc(t('detail.warn_title'))}</b><ul class="notes">${warns.map(x => `<li>${esc(t('warn.' + x.code, x))}</li>`).join('')}</ul></div>`;
    if (r.parsed && typeof r.parsed.body === 'string' && r.parsed.body) b += `<details class="d"><summary>${esc(t('detail.body'))}</summary><pre class="pdftext">${esc(r.parsed.body)}</pre></details>`;

    if (ui.editData && !locked) {
      b += `<div class="card"><h2>${esc(t('detail.edit_data_title'))}</h2><label class="small muted">${esc(t('field.title'))}</label><input class="in" id="f-title" value="${esc(w.title)}">` +
        `<div class="grid2" style="margin-top:8px"><div><label>${esc(t('field.from'))}</label><input class="in" type="date" id="f-from" value="${esc(w.from || '')}"></div>` +
        `<div><label>${esc(t('field.to'))}</label><input class="in" type="date" id="f-to" value="${esc(w.to || '')}"></div>` +
        `<div><label>${esc(t('field.hours'))}</label><input class="in" id="f-hours" value="${esc(w.hours || '')}"></div>` +
        `<div><label>${esc(t('field.vhf'))}</label><input class="in" id="f-vhf" value="${esc(w.vhf || '')}"></div>` +
        `<div><label>${esc(t('field.radius'))} (m)</label><input class="in" id="f-radius" value="${esc(w.radius || '')}"></div></div>` +
        `<div class="row" style="margin-top:10px"><button class="btn okb sm" data-act="savedata" data-no="${esc(no)}">${esc(t('common.save'))}</button><button class="btn ghost sm" data-act="canceldata">${esc(t('common.cancel'))}</button></div></div>`;
    } else {
      b += `<dl class="f"><dt>${esc(t('detail.published'))}</dt><dd>${r.rss && r.rss.published ? esc(ctx.fmtDate(r.rss.published)) : '—'}</dd>` +
        `<dt>${esc(t('detail.period'))}</dt><dd>${w.from ? esc(w.to ? t('detail.period_value', { from: ctx.fmtDate(w.from), to: ctx.fmtDate(w.to) }) : t('detail.period_open', { from: ctx.fmtDate(w.from) })) : `<i>${esc(t('detail.period_none'))}</i>`}</dd>` +
        (w.hours ? `<dt>${esc(t('field.hours'))}</dt><dd>${esc(w.hours)}</dd>` : '') + (w.vhf ? `<dt>${esc(t('field.vhf'))}</dt><dd>${esc(w.vhf)}</dd>` : '') +
        (w.radius ? `<dt>${esc(t('field.radius'))}</dt><dd>${esc(w.radius)} m</dd>` : '') +
        `<dt>${esc(t('detail.read_by'))}</dt><dd>${esc(r.readBy || '—')}</dd>` +
        (r.approvedBy && r.status !== 'draf' ? `<dt>${esc(t('detail.approved_by'))}</dt><dd>${esc(r.approvedBy)}</dd>` : '') + `</dl>` +
        (locked ? '' : `<button class="btn ghost sm" data-act="editdata">${esc(t('detail.edit_data'))}</button>`);
    }
    if (w.supersedes) b += `<div class="card warn small" style="margin-top:8px">${esc(t('detail.supersedes', { old: w.supersedes }))}</div>`;
    const sb = supersededBy(S, no);
    if (sb) b += `<div class="card small" style="margin-top:8px">${esc(t('detail.superseded_by', { no: sb }))}</div>`;

    if (wantsGeo(w) || countPts(w)) {
      const flagged = (gi, pi) => is.some(i => i.gi === gi && i.pi === pi);
      if (w.groups.length) {
        b += `<div class="row wrap" style="margin:10px 0 2px">${esc(t('detail.shape'))}: ` + w.groups.map((g, gi) => locked
          ? `<b>${esc(t('shape.' + g.type))}</b>`
          : `<select class="sel" data-act="shape" data-no="${esc(no)}" data-g="${gi}">${detailShapes.map(k => `<option value="${k}" ${g.type === k ? 'selected' : ''}>${esc(t('shape.' + k))}</option>`).join('')}</select>`).join(' ') + `</div>`;
      }
      b += w.groups.map((g, gi) => `<div class="small muted" style="margin:8px 0 2px">${esc(t('shape.' + g.type))}${g.name && !/^(area|titik|lingkaran)$/i.test(g.name) ? ' · ' + esc(g.name) : ''} · ${esc(tn('detail.points', g.pts.length))}</div>` +
        `<table class="pts"><tr><th>#</th><th>${esc(t('detail.col_lat'))}</th><th>${esc(t('detail.col_lon'))}</th><th></th></tr>${g.pts.map((q, pi) => pointRow(ctx, no, r, gi, pi, q, flagged(gi, pi), ui, locked)).join('')}</table>`).join('');
      if (!locked) {
        if (!countPts(w)) {
          b += `<div class="card warn small" style="margin-top:8px"><b>${esc(t('detail.manual_title'))}</b><div style="margin:6px 0">${esc(t('detail.paste_title'))}</div>` +
            `<textarea class="in" id="paste-txt" placeholder="1 01°18.491' 103°42.623'&#10;2 01°18.413' 103°42.627'"></textarea>` +
            `<div class="row" style="margin-top:6px"><button class="btn sm" data-act="pastecoords" data-no="${esc(no)}">${esc(t('detail.paste_button'))}</button><button class="btn ghost sm" data-act="samplepaste">${esc(t('detail.paste_sample'))}</button></div></div>`;
        }
        b += `<details class="d" ${countPts(w) ? '' : 'open'}><summary>${esc(t('detail.add_title'))}</summary><div class="grid2" style="margin-top:6px">` +
          `<div><label>${esc(t('detail.add_lat'))}</label><input class="in" id="n-lat"></div><div><label>${esc(t('detail.add_lon'))}</label><input class="in" id="n-lon"></div>` +
          `<div><label>${esc(t('detail.add_label'))}</label><input class="in" id="n-lab"></div></div><div style="margin-top:6px"><button class="btn sm" data-act="addpt" data-no="${esc(no)}">${esc(t('detail.add_button'))}</button></div></details>`;
        b += `<div class="row wrap" style="margin-top:8px"><button class="btn ghost sm" data-act="editmap" data-no="${esc(no)}">${esc(t('detail.edit_map'))}</button>` +
          (!countPts(w) ? `<button class="btn ghost sm" data-act="nocoord" data-no="${esc(no)}">${esc(t('detail.no_coord'))}</button>` : '') + `</div>`;
      }
    } else b += `<div class="card small" style="margin-top:8px">${esc(t('detail.advisory_note'))}</div>`;

    if (r.status === 'draf') {
      if (needsAck(S, no) && !blocked) b += `<label class="ck"><input type="checkbox" data-act="ack" data-no="${esc(no)}" ${r.ack ? 'checked' : ''}> ${esc(t('detail.ack'))}</label>`;
      foot = `<button class="btn okb" data-act="approve" data-no="${esc(no)}" ${blocked ? 'disabled' : ''}>${esc(wantsGeo(w) ? t('detail.approve_plot') : t('detail.approve_read'))}</button>` +
        `<button class="btn ghost" data-act="reread" data-no="${esc(no)}">${esc(t('detail.reread'))}</button>`;
    } else if (r.status === 'disetujui') foot = `<button class="btn ghost" data-act="unapprove" data-no="${esc(no)}">${esc(t('detail.unapprove'))}</button>`;
    else if (locked) b += `<div class="card small">${esc(t('err.locked'))}</div>`;
  }
  if (r.rss && safeHttpUrl(r.rss.link)) b += `<p class="small"><a href="${esc(safeHttpUrl(r.rss.link))}" target="_blank" rel="noopener">${esc(t('detail.open_mpa'))}</a></p>`;
  b += `<div class="disc">${esc(t('disclaimer.map'))}</div>`;
  return `<div class="sheet"><div class="bar"><b>${esc(t('detail.bar', { no }))}</b><button class="btn ghost sm" data-act="close">${esc(t('common.close'))}</button></div>` +
    `<div class="body">${b}</div>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}

/* ---- app/views/export.js ---- */
/* ===== Tampilan Ekspor ===== */

const EXPORT_VERS = ['1.0', '1.1', '1.2'];

/** Tombol simpan berkas sungguhan (hanya bila ctx.filesReady): nama dan versi user chart, empat tombol Simpan, catatan master PMN RECORD (di server). */
function saveBox(ctx) {
  if (!ctx.filesReady) return '';
  const { t } = ctx, busy = ctx.saving ? ' disabled' : '';
  const ver = EXPORT_VERS.includes(ctx.chartVer) ? ctx.chartVer : '1.2';
  const btn = (act, key, cls) => `<button class="btn sm${cls || ''}" data-act="${act}"${busy}>${esc(t(key))}</button>`;
  const r = ctx.ready;
  const ready = r ? `<div class="card ok" style="margin:8px 0"><b>${esc(t('export.ready_files', { files: r.names.join(', ') }))}</b>` +
    (r.notes && r.notes.length ? `<ul class="notes">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '') +
    `<div class="row" style="gap:8px;margin-top:8px"><button class="btn okb" data-act="shareReady">${esc(t('export.share'))}</button>` +
    `<button class="btn ghost" data-act="cancelReady">${esc(t('export.cancel_ready'))}</button></div></div>` : '';
  return `<div class="savebox" style="margin-top:8px">${ready}` +
    `<div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">` +
    `<label class="small" style="flex:1 1 160px">${esc(t('export.chart_name'))}<input class="in" data-act="setChartName" value="${esc(ctx.chartName || 'Singapore PMN')}" maxlength="60"></label>` +
    `<label class="small">${esc(t('export.chart_ver'))}<br><select class="sel" data-act="setChartVer">${EXPORT_VERS.map(v => `<option value="${v}"${v === ver ? ' selected' : ''}>${v}</option>`).join('')}</select></label></div>` +
    `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${btn('saveXml', 'export.save_xml')}${btn('saveZip', 'export.save_zip')}${btn('saveXlsx', 'export.save_xlsx')}${btn('saveAll', 'export.save_all', ' okb')}</div>` +
    (ctx.saving ? `<div class="small muted" style="margin-top:4px">${esc(t('export.saving'))}</div>` : '') +
    `<div class="small muted" style="margin-top:8px">${esc(t('export.master_server'))}</div>` +
    (ctx.live ? `<div style="margin-top:6px"><button class="btn sm ghost" data-act="pickExcel"${busy}>${esc(t('export.pick_excel'))}</button> <span class="small muted">${esc(t('export.master_hint'))}</span></div>` : '') + `</div>`;
}

/** Nama Excel yang sungguh dibagikan: PMN RECORD.xlsx bila aplikasi bisa menyimpan berkas, selain itu nama paket. */
const xlsxName = (ctx, e) => (ctx.filesReady ? EX_XLSX_NAME : e.files.xlsx);

function renderExport(ctx) {
  const { S, t, tn } = ctx;
  const ready = nosByStatus(S, 'disetujui'), waiting = nosByStatus(S, 'diekspor'), e = S.lastExport, mode = exportMode(S);
  let h = '';
  if (!ctx.filesReady) h += `<div class="card warn small">${esc(t('export.sim_note'))}</div>`;
  h += `<div class="card"><h2>${esc(t('export.ready_title', { n: ready.length }))}</h2>`;
  if (ready.length) {
    h += ready.map(n => { const w = S.pm[n].work; return `<div class="row sp" style="padding:4px 0"><span><b>PMN ${esc(n)}</b> <span class="small muted">${esc(w.title.slice(0, 34))}</span></span>` +
      `<span class="row">${correctedChip(ctx, S.pm[n])}${chip(w.kind === 'plot' ? 'ok2' : 'info', t(w.kind === 'plot' ? 'export.kind_plot' : 'export.kind_info'))}</span></div>`; }).join('');
  } else h += `<div class="empty">${esc(t(mode === 're' ? 'export.all_done' : 'export.empty'))}</div>`;
  const remReady = ecdisRemovals(S, ready);
  if (remReady.length) {
    h += `<div class="card bad" style="margin-top:8px"><b>${esc(t('export.remove_title'))}</b><ul class="notes">${remReady.map(x => `<li>${esc(t('export.remove_item', { old: x.old, new: x.new }))}</li>`).join('')}</ul></div>`;
  }
  h += `<div style="margin-top:10px">` + (mode === 're'
    ? `<button class="btn" data-act="reExport">${esc(t('export.re'))}</button>`
    : `<button class="btn" data-act="makeExport" ${ready.length ? '' : 'disabled'}>${esc(t('export.make'))}</button>`) +
    (approvedNos(S).length ? ` <button class="btn ghost" data-act="makeFullExport">${esc(t('export.make_full'))}</button>` : '') + `</div></div>`;
  if (e && e.removePdfs && e.removePdfs.length) {
    h += `<div class="card bad"><b>${esc(t('export.remove_pdf_title'))}</b><ul class="notes">${e.removePdfs.map(x => `<li>${esc(t('export.remove_pdf_item', { no: x.no }))}</li>`).join('')}</ul></div>`;
  }
  if (waiting.length && e) {
    const cur = e.step || 0;
    const rem = !e.xmlList && e.removeFromEcdis && e.removeFromEcdis.length ? `<div class="card bad"><b>${esc(t('export.remove_title'))}</b><ul class="notes">${e.removeFromEcdis.map(x => `<li>${esc(t('export.remove_item', { old: x.old, new: x.new }))}</li>`).join('')}</ul></div>` : '';
    const xn = xlsxName(ctx, e);
    const files = list => `<ul class="files">${list.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
    const steps = [
      `${esc(t('export.s1'))}${files([e.files.xml, e.files.zip, xn])}${saveBox(ctx)}`,
      `${esc(t('export.s2'))}${files([e.files.xml])}${rem}`,
      esc(t('export.s3', { no: e.no })),
      `${esc(t('export.s4'))}${files([e.files.zip, xn])}`,
    ];
    h += `<div class="card act"><h2>${esc(t('export.waiting_title'))}</h2><div class="small muted">${esc(t('export.waiting_meta', { when: fmtWhen(ctx, e.at), by: e.by, no: e.no }))}</div><ol class="steps">` +
      steps.slice(0, cur + 1).map((x, i) => i < cur
        ? `<li class="step done"><span class="tick">✓</span> ${x}</li>`
        : `<li class="step">${x}<div style="margin-top:8px"><button class="btn okb" data-act="exportstep">${esc(t('export.done'))}</button></div></li>`).join('') + `</ol></div>`;
  }
  if (e && e.files && !waiting.length) {
    const fl = [e.files.xml, e.files.zip, xlsxName(ctx, e)];
    const rem = !e.xmlList && e.removeFromEcdis && e.removeFromEcdis.length ? `<div class="card bad"><b>${esc(t('export.remove_title'))}</b><ul class="notes">${e.removeFromEcdis.map(x => `<li>${esc(t('export.remove_item', { old: x.old, new: x.new }))}</li>`).join('')}</ul></div>` : '';
    h += `<div class="card act"><h2>${esc(t('export.last_title'))}</h2><div class="small muted">${esc(t('export.last_meta', { when: fmtWhen(ctx, e.at), by: e.by, n: e.list.length }))}</div>` +
      `<div class="small muted">${esc(t('export.scope_' + (e.scope === 'full' ? 'full' : 'routine')))}${typeof ctx.xmlObjects === 'number' ? ' ' + esc(t('export.scope_objects', { n: ctx.xmlObjects })) : ''}</div>` +
      `<ul class="files">${fl.map(f => `<li>${esc(f)}</li>`).join('')}</ul>${rem}<p class="small">${esc(t('export.save_hint'))}</p>${saveBox(ctx)}</div>`;
  }
  h += `<div class="disc">${esc(t('disclaimer.map'))}</div>`;
  return h;
}

/* ---- app/map.js ---- */
/* ===== Peta: spesifikasi lapisan (murni, diuji di Node) dan pembungkus Leaflet (browser) ===== */

const MAP_BLUE = '#1d6fb8', MAP_ORANGE = '#e07b00';

/**
 * Daftar lapisan untuk digambar: [{no, gi, kind:'polygon'|'circles'|'markers', latlngs, style:{color,dashArray}, bad:number[], radius?}].
 * filter 'aktif' menyembunyikan PMN digantikan/berakhir (kecuali draf); stub dan PMN yang belum dibaca dilewati.
 */
function layerSpecs(S, filter, today) {
  const out = [];
  for (const no of Object.keys(S.pm)) {
    const r = S.pm[no];
    if (r.stub || !r.work) continue;
    const ts = timeStatusOf(S, no, today);
    if (filter === 'aktif' && r.status !== 'draf' && (ts.code === 'superseded' || ts.code === 'expired')) continue;
    const draft = r.status === 'draf';
    const bad = issuesOf(S, no).filter(i => i.pi != null);
    r.work.groups.forEach((g, gi) => {
      if (!g.pts.length) return;
      const latlngs = g.pts.map(q => [q.lat, q.lon]);
      let kind = 'markers';
      if (g.type === 'area' && latlngs.length >= 3) kind = 'polygon';
      else if (g.type === 'circles' || (r.work.radius && g.type !== 'area')) kind = 'circles';
      const spec = {
        no, gi, kind, latlngs,
        style: { color: draft ? MAP_ORANGE : MAP_BLUE, dashArray: draft ? '6 5' : null },
        bad: bad.filter(i => i.gi === gi).map(i => i.pi),
      };
      if (kind === 'circles') spec.radius = r.work.radius || 150;
      out.push(spec);
    });
  }
  return out;
}

/** Titik untuk menyesuaikan tampilan peta; titik bertanda masalah tidak ikut. */
function fitPoints(specs) {
  const pts = [];
  for (const s of specs) s.latlngs.forEach((p, i) => { if (!s.bad.includes(i)) pts.push(p); });
  return pts;
}

/**
 * Pembungkus Leaflet. deps = {L, onOpen(no), onMovePoint(no,gi,pi,lat,lon), onDeletePoint(no,gi,pi), onAddPoint(no,lat,lon), t}.
 * Hanya jalan di browser (diperiksa di Tugas 13). Tombol hapus di popup dipasang lewat popupopen karena Leaflet
 * menghentikan perambatan klik di dalam popup (delegasi data-act dari document tidak akan sampai).
 */
function createMap(el, deps) {
  const L = deps.L;
  const map = L.map(el, { zoomControl: false }).setView([1.28, 103.8], 11);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let editNo = null, addMode = false, view = null;
  const esc2 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const numIcon = (label, bad) => L.divIcon({
    className: '', iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<div style="width:26px;height:26px;border-radius:99px;background:${bad ? '#b42318' : MAP_ORANGE};color:#fff;border:2px solid #fff;font:700 11px/22px sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.5)">${esc2(label)}</div>`,
  });

  map.on('click', e => {
    if (!editNo || !addMode) return;
    addMode = false;
    deps.onAddPoint(editNo, e.latlng.lat, e.latlng.lng);
  });

  function draw(S, filter, today) {
    editNo = null; addMode = false; layer.clearLayers();
    const specs = layerSpecs(S, filter, today);
    for (const s of specs) {
      const opt = { color: s.style.color, weight: 2, dashArray: s.style.dashArray, fillOpacity: 0.18 };
      let l;
      if (s.kind === 'polygon') l = L.polygon(s.latlngs, opt);
      else if (s.kind === 'circles') l = L.featureGroup(s.latlngs.map(p => L.circle(p, Object.assign({}, opt, { radius: s.radius }))));
      else l = L.featureGroup(s.latlngs.map(p => L.circleMarker(p, Object.assign({}, opt, { radius: 6, fillOpacity: 0.7 }))));
      l.bindTooltip(`PMN ${esc2(s.no)}`, { sticky: true }).on('click', () => deps.onOpen(s.no)).addTo(layer);
      for (const pi of s.bad) {
        L.marker(s.latlngs[pi], { icon: L.divIcon({ className: '', html: `<div style="background:#b42318;color:#fff;border-radius:99px;padding:1px 7px;font:600 12px sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">⚠ ${pi + 1}</div>` }) })
          .on('click', () => deps.onOpen(s.no)).addTo(layer);
      }
    }
    const pts = fitPoints(specs);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15));
    setTimeout(() => map.invalidateSize(), 60);
  }

  function edit(S, no) {
    editNo = no; layer.clearLayers();
    const w = S.pm[no].work;
    const bad = new Set(issuesOf(S, no).filter(i => i.pi != null).map(i => `${i.gi}:${i.pi}`));
    const all = [];
    w.groups.forEach((g, gi) => {
      const ll = g.pts.map(q => [q.lat, q.lon]);
      ll.forEach(p => all.push(p));
      const style = { color: MAP_ORANGE, weight: 2, dashArray: '6 5', fillOpacity: 0.15 };
      const poly = g.type === 'area' && ll.length >= 3 ? L.polygon(ll, style).addTo(layer) : L.polyline(ll, { color: MAP_ORANGE, weight: 1, dashArray: '3 6' }).addTo(layer);
      g.pts.forEach((q, pi) => {
        const mk = L.marker([q.lat, q.lon], { draggable: true, icon: numIcon(q.label, bad.has(`${gi}:${pi}`)) }).addTo(layer);
        mk.on('drag', ev => { const c = ev.target.getLatLng(); poly.setLatLngs(g.pts.map((x, i) => (i === pi ? [c.lat, c.lng] : [x.lat, x.lon]))); });
        mk.on('dragend', ev => { const c = ev.target.getLatLng(); deps.onMovePoint(no, gi, pi, c.lat, c.lng); });
        mk.bindPopup(`<b>${esc2(q.label)}</b><br>${esc2(q.latDM)} ${esc2(q.lonDM)}<br><button style="margin-top:6px">${esc2(deps.t('common.delete'))}</button>`);
        mk.on('popupopen', ev => {
          const b = ev.popup.getElement().querySelector('button');
          if (b) b.onclick = () => { map.closePopup(); deps.onDeletePoint(no, gi, pi); };
        });
      });
    });
    if (view) map.setView(view.c, view.z); else if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.2));
  }

  return {
    draw, edit,
    keepView() { view = { c: map.getCenter(), z: map.getZoom() }; },
    stopEdit() { editNo = null; addMode = false; view = null; },
    setAddMode(v) { addMode = !!v; },
    destroy() { map.remove(); },
    raw: map,
  };
}

/* ---- app/controller.js ---- */
/* ===== Pengendali: menghubungkan tindakan pengguna (data-act) ke model, sinkronisasi, dan tampilan ===== */
/* Semua ketergantungan (API, DOM, jam, dialog) disuntikkan lewat deps sehingga bisa diuji di Node. */

const CACHE_KEY = 'pmn-cache';
const NO_RE = /^\d{1,3}\/\d{4}$/;
const hostOf = u => { const m = String(u || '').match(/^https:\/\/([^/\s]+)/i); return m ? m[1] : ''; };
const DEFAULT_OFFICERS = ['Master', 'Chief Officer', '2nd Master', 'Ship phone'];

/**
 * deps = {S, api, sync, storage, i18n, now(), today(), officer(), officers?, live?, makeApi(url, code)?, reload()?, readPdf(file), pdfTextFromBase64(b64),
 *         ask:{confirm, prompt}, clipboard:{write}, dom:{val(id), set(id,v)}, ui:{render, toast, pickFile}, demo?,
 *         files?: {share([{name, blob}]) -> {ok, downloaded?, cancelled?}, pickExcel() -> {buf, name}|null}, pdfTimeoutMs? (bawaan 20000),
 *         xlsx?: {updateRecord, readRecord} (bawaan: fungsi global app/zipxlsx.js)}
 * Tanpa deps.files tombol Simpan tidak tampil (ctx.filesReady false).
 */
function createController(deps) {
  const { S, api, sync, storage, i18n, ask, dom, ui } = deps;
  const st = { tab: 'home', detailNo: null, editRow: null, editData: false, mapEdit: null, mapAdd: false, mapFilter: 'aktif', listTab: 'aktif', busy: null, reading: null, demoDown: false, pdf: null,
    chartName: '', chartVer: '1.2', saving: null, ready: null };
  const t = (k, p) => i18n.t(k, p);
  const who = () => deps.officer();
  const toast = m => ui.toast(m);

  function ctx() {
    return { S, t: i18n.t, tn: i18n.tn, fmtDate: i18n.fmtDate, now: deps.now(), today: deps.today(), officer: who(), officers: deps.officers || DEFAULT_OFFICERS, live: !!deps.live, serverHost: deps.live ? hostOf(storage.getItem('pmn-server-url')) : '', pdf: st.pdf, busy: st.busy, reading: st.reading, i18n,
      filesReady: !!deps.files, chartName: chartNameOf(), chartVer: st.chartVer, saving: st.saving,
      ready: st.ready ? { kind: st.ready.kind, names: st.ready.names, notes: st.ready.notes } : null,
      listTab: st.listTab,
      xmlObjects: S.lastExport && S.lastExport.list ? exObjectCount(S, xmlNos(S.lastExport)) : null };
  }
  const saveCache = () => { try { storage.setItem(CACHE_KEY, JSON.stringify(S)); } catch (e) { /* abaikan */ } };
  const pending = () => sync.pending();

  /** Simpan lokal, gambar ulang, lalu dorong ke server (tanpa menjatuhkan aplikasi bila gagal). */
  async function persist() {
    saveCache(); ui.render();
    try {
      const r = await sync.push(S);
      if (r.conflicts.length) toast(t('err.conflict'));
      else if (r.errors && r.errors.length) toast(t('err.' + r.errors[0].code));
    } catch (e) { /* offline: sudah diantrekan oleh sync */ }
    saveCache(); ui.render();
  }
  async function flush() {
    try { const r = await sync.flush(S); if (r.conflicts.length) toast(t('err.conflict')); } catch (e) { /* tetap di antrean */ }
    saveCache(); ui.render();
  }
  const statusText = st0 => (st0 ? t('work.' + st0) : '');
  const fail = (res, no) => toast(t('err.' + res.code, { no, status: statusText(res.status) }));
  async function commit(res, no, okMsg) {
    if (!res.ok) { fail(res, no); ui.render(); return res; }
    if (okMsg) toast(okMsg);
    await persist();
    return res;
  }
  const pt = el => ({ gi: +el.dataset.g, pi: +el.dataset.p });

  async function doCheck() {
    let r;
    try { r = await api.runCheck(); } catch (e) { toast(t('err.offline')); return; }
    if (!r.ok) { markCheckFailed(S, deps.now(), r.code); toast(t('err.' + r.code)); await persist(); return; }
    try { await sync.pull(S); } catch (e) { toast(t('err.offline')); return; }
    toast(r.added.length ? t('toast.check_added', { n: r.added.length }) : t('toast.check_none'));
    saveCache(); ui.render();
  }

  async function readOne(no, quiet) {
    st.reading = no; ui.render();
    try {
      const res = await api.getPdf(no);
      if (!res.ok) { toast(t('err.' + res.code)); return; }
      const text = res.text != null ? res.text : await deps.pdfTextFromBase64(res.base64);
      const r = readResult(S, no, parsePmnText(text, { no }), who(), deps.now());
      if (!r.ok) fail(r, no);
    } catch (e) { toast(t('err.pdf_js_load')); } finally { st.reading = null; }
    if (!quiet) await persist();
  }

  /** Pemeriksa silang: HP membaca PDF sendiri dengan pdf.js dan membandingkannya dengan bacaan server (bagian -a/-b: grup yang sesuai). Gagal = diam. */
  const crossBusy = {};
  async function crossRead(no) {
    const r = S.pm[no];
    if (!r || r.stub || !r.parsed) return;
    crossBusy[no] = Date.now();
    try {
      const res = await api.getPdf(no);
      if (!res.ok) return;
      const text = res.text != null ? res.text : await deps.pdfTextFromBase64(res.base64);
      const diffs = crossCheckPart(S, no, toParsed(parsePmnText(text, { no: baseNo(no) })));
      if (r.cross && r.cross.diffs.join() === diffs.join()) return;
      setCross(S, no, diffs, deps.now());
      await persist();
    } catch (e) { /* tanpa pemeriksa silang aplikasi tetap jalan */ }
    finally { delete crossBusy[no]; }
  }

  /* ----- Berkas ekspor sungguhan (XML, ZIP PDF, Excel) dari paket terakhir. Tidak pernah mengubah S. -----
     iPhone hanya membuka lembar Bagikan bila share() dipanggil langsung dari sentuhan, tanpa menunggu apa pun. Karena itu:
     XML (dibuat seketika) dibagikan dalam satu sentuhan; ZIP, Excel, dan "semua" dua langkah: Siapkan (berkas disimpan di st.ready),
     lalu Bagikan (shareReady memanggil share tanpa await sebelumnya). */
  const files = deps.files;
  const xl = () => deps.xlsx || { updateRecord, readRecord };
  const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const PDF_TIMEOUT = deps.pdfTimeoutMs || 20000;
  const VERS = ['1.0', '1.1', '1.2'];
  const hasStreams = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
  const b64bytes = b64 => { const bin = atob(b64), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  const exportDate = e => { const m = /\d{4}-\d{2}-\d{2}/.exec((e && e.files && e.files.xml) || ''); return m ? m[0] : deps.today(); };
  const defaultChartName = () => 'Singapore PMN ' + exportDate(S.lastExport);
  const chartNameOf = () => st.chartName || defaultChartName();
  const dateOf = iso => (iso ? i18n.fmtDate(sgtToday(new Date(iso))) : '–');
  st.chartName = storage.getItem('pmn-chart-name') || '';
  st.chartVer = VERS.includes(storage.getItem('pmn-chart-ver')) ? storage.getItem('pmn-chart-ver') : '1.2';

  /** Daftar PMN tiap berkas paket; paket lama tanpa bidang khusus memakai list. */
  const xmlNos = e => e.xmlList || e.list, pdfNos = e => e.pdfList || e.list, excelNos = e => e.excelList || e.list;
  function xmlFile(e) {
    const xml = exUserChartXml(S, xmlNos(e), { name: chartNameOf(), ver: st.chartVer });
    return { name: e.files.xml, blob: new Blob([xml], { type: 'application/xml' }) };
  }

  /** Satu PDF dari server dengan batas waktu: {res} atau {kind: 'offline' | 'auth'}. */
  async function fetchPdf(no) {
    let timer;
    const late = new Promise(done => { timer = setTimeout(() => done({ kind: 'offline' }), PDF_TIMEOUT); });
    try {
      const got = Promise.resolve().then(() => api.getPdf(no)).then(res => ({ res }), err => ({ kind: err && err.message === 'err_auth' ? 'auth' : 'offline' }));
      return await Promise.race([got, late]);
    } finally { clearTimeout(timer); }
  }
  /** ZIP: paling banyak 3 unduhan sekaligus; yang gagal dihitung per sebab (offline, akses, PDF tidak ada). */
  async function zipBuild(e) {
    const list = exPdfEntries(S, pdfNos(e)), got = new Array(list.length);
    let next = 0;
    const worker = async () => { while (next < list.length) { const i = next++; got[i] = await fetchPdf(list[i].no); } };
    await Promise.all([worker(), worker(), worker()]);
    const out = new Map(), miss = { offline: 0, auth: 0, missing: 0 };
    got.forEach((g, i) => {
      const r = g.res;
      if (r && r.ok && r.base64) out.set(list[i].name, b64bytes(r.base64));
      else if (r && r.ok && r.text != null) out.set(list[i].name.replace(/\.pdf$/, '.txt'), new TextEncoder().encode(r.text));
      else if (g.kind) miss[g.kind]++;
      else if (r && r.code === 'err_auth') miss.auth++;
      else miss.missing++;
    });
    const notes = ['offline', 'auth', 'missing'].filter(k => miss[k]).map(k => t('toast.pdf_' + k, { n: miss[k] }));
    if (!out.size) return { files: [], notes: [t('toast.save_no_pdfs')].concat(notes) };
    return { files: [{ name: e.files.zip, blob: await zip(out, { compress: false }) }], notes };
  }

  async function pickRaw() { try { return (await files.pickExcel()) || null; } catch (err) { return null; } }
  /** Workbook PMN RECORD yang sah: terbaca dan punya baris PMN. */
  async function validate(buf) {
    if (!hasStreams()) return { ok: false, code: 'browser_old' };
    let rec;
    try { rec = await xl().readRecord(buf); } catch (err) { return { ok: false, code: 'excel_bad' }; }
    return rec && rec.rows && rec.rows.length ? { ok: true, rows: rec.rows } : { ok: false, code: 'excel_bad' };
  }
  const bytesB64 = buf => { const u = new Uint8Array(buf); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
  /** Excel: master PMN RECORD ada di Drive (server). Diambil, baris PMN paket yang belum ada ditambahkan (tanpa membuang sheet),
      Remark diperbarui, lalu bila ada perubahan disimpan balik ke server. Berkas yang dibagikan selalu keadaan terbaru. */
  async function xlsxBuild(e) {
    if (!hasStreams()) return { files: [], notes: [t('err.browser_old')] };
    let got;
    try { got = await api.getExcel(); } catch (err) { return { files: [], notes: [t(err && err.message === 'err_auth' ? 'err.err_auth' : 'toast.excel_offline')] }; }
    if (!got || !got.ok || !got.base64) return { files: [], notes: [t(got && got.code === 'err_auth' ? 'err.err_auth' : got && got.code === 'no_excel' ? 'err.no_excel' : 'toast.excel_offline')] };
    const buf0 = b64bytes(got.base64).buffer, v = await validate(buf0);
    if (!v.ok) return { files: [], notes: [t('err.' + v.code)] };
    const have = new Set(v.rows.map(r => r.no));
    const entries = exExcelEntries(S, excelNos(e)).filter(x => !have.has(x.no));
    const remarks = exExcelRemarks(S, excelNos(e));
    let buf = buf0, blob, res = null;
    if (entries.length || remarks.length) { res = await xl().updateRecord(buf0, entries, { dropSheets: [], remarks }); blob = res.blob; buf = await blob.arrayBuffer(); }
    else blob = new Blob([buf0], { type: XLSX_TYPE });
    const upd = res && res.updated ? res.updated.length : 0, skp = res && res.skipped ? res.skipped.length : 0;
    const notes = entries.length || upd ? [] : [t('toast.save_excel_nothing_new')];
    if (upd || skp) notes.push(t('toast.save_excel_remarks', { u: upd, s: skp }));
    if (entries.length || upd) {
      let saved = null;
      try { saved = await api.putExcel(bytesB64(buf)); } catch (err) { saved = null; }
      if (!saved || !saved.ok) notes.push(t('toast.excel_not_saved'));
    }
    return { files: [{ name: EX_XLSX_NAME, blob }], notes };
  }

  /** Membagikan sekarang: share dipanggil sinkron (tanpa await sebelumnya). Hasil: dibagikan, diunduh, dibatalkan, atau gagal. */
  function shareNow(list, notes) {
    let p;
    try { p = files.share(list); } catch (err) { p = null; }
    const report = r => {
      const names = list.map(f => f.name).join(', ');
      if (r && r.ok) { toast([t(r.downloaded ? 'toast.save_downloaded' : 'toast.shared', { files: names })].concat(notes || []).join(' ')); return true; }
      toast(t(r && r.cancelled ? 'toast.share_cancelled' : 'toast.save_failed'));
      return false;
    };
    return Promise.resolve(p).then(report, () => report(null));
  }
  function withExport(fn) {
    if (!files) { toast(t('toast.save_failed')); return; }
    const e = S.lastExport;
    if (!e || !e.list || !e.files) { toast(t('toast.save_no_export')); return; }
    return fn(e);
  }
  /** Langkah 1 (Siapkan): membuat berkas lalu menyimpannya di st.ready untuk tombol Bagikan. */
  const prepare = (kind, build) => withExport(async e => {
    st.saving = kind; st.ready = null; ui.render();
    try {
      const r = await build(e);
      if (r.files.length) {
        st.ready = { kind, names: r.files.map(f => f.name), files: r.files, notes: r.notes };
        toast([t('toast.ready', { files: st.ready.names.join(', ') })].concat(r.notes).join(' '));
      } else toast(r.notes.join(' ') || t('toast.save_failed'));
    } catch (err) { toast(t('toast.save_failed')); } finally { st.saving = null; ui.render(); }
  });
  const SAVE = {
    saveXml: () => withExport(e => {
      if (!exObjectCount(S, xmlNos(e))) { toast(t('err.no_objects')); return; }
      return shareNow([xmlFile(e)]);
    }),
    saveZip: () => prepare('zip', zipBuild),
    saveXlsx: () => prepare('xlsx', xlsxBuild),
    saveAll: () => prepare('all', async e => {
      const x = await xlsxBuild(e); // Excel dulu: pertanyaan dan pemilih berkas masih dekat dengan sentuhan
      const z = await zipBuild(e);
      const hasXml = exObjectCount(S, xmlNos(e)) > 0;
      return { files: (hasXml ? [xmlFile(e)] : []).concat(z.files, x.files), notes: (hasXml ? [] : [t('err.no_objects')]).concat(z.notes, x.notes) };
    }),
    shareReady() {
      const r = st.ready;
      if (!r || !files) return;
      return shareNow(r.files, r.notes).then(ok => { if (ok && st.ready === r) st.ready = null; ui.render(); });
    },
    cancelReady() { st.ready = null; ui.render(); },
    /** Mengunggah PMN RECORD.xlsx kapal sebagai master di server (sekali, atau untuk menggantinya). */
    async pickExcel() {
      if (!files) { toast(t('toast.save_failed')); return; }
      const p = await pickRaw();
      if (!p) { toast(t('toast.excel_pick_cancelled')); return; }
      const v = await validate(p.buf);
      if (!v.ok) { toast(t('err.' + v.code)); return; }
      let r = null;
      try { r = await api.putExcel(bytesB64(p.buf)); } catch (err) { r = null; }
      toast(r && r.ok ? t('toast.excel_uploaded', { name: p.name }) : t(r && r.code === 'err_auth' ? 'err.err_auth' : 'toast.excel_upload_failed'));
    },
    setChartName(no, el) {
      const raw = String((el && el.value) || '').trim();
      st.chartName = raw && exChartName(raw) !== defaultChartName() ? exChartName(raw) : '';

    setChartVer(no, el) {
      st.chartVer = VERS.includes(el && el.value) ? el.value : '1.2';

    tab(no) { st.tab = no; st.detailNo = null; st.mapEdit = null; st.mapAdd = false; ui.render(); },

      st.detailNo = no; st.editRow = null; st.editData = false; st.pdf = null;

      crossRead(no);
      ACT.showpdf(no, null, true);

    close() { st.detailNo = null; st.pdf = null; ui.render(); },
    async showpdf(no, el, quiet) {

    pickpdf() { ui.pickFile(); },

    usedemo() { resetLocal(); storage.removeItem('pmn-server-url'); storage.removeItem('pmn-server-code'); deps.reload(); },
    editpt(no, el) { st.editRow = Object.assign({ no }, pt(el)); ui.render(); },
    cancelpt() { st.editRow = null; ui.render(); },
    savept(no, el) {

    },
    restorept(no, el) { const p = pt(el); return commit(restorePoint(S, no, p.gi, p.pi, who(), deps.now()), no); },
    delpt(no, el) { const p = pt(el); return commit(deletePoint(S, no, p.gi, p.pi, who(), deps.now()), no); },
    addpt(no) {

    },
    pastecoords(no) { return commit(pasteCoords(S, no, dom.val('paste-txt'), who(), deps.now()), no); },
    samplepaste() { dom.set('paste-txt', "1 01°18.491' 103°42.623'\n2 01°18.413' 103°42.627'\n3 01°18.417' 103°42.685'\n4 01°18.476' 103°42.668'"); },
    nocoord(no) { return commit(setNoCoords(S, no, who(), deps.now()), no); },
    editdata() { st.editData = true; ui.render(); },
    canceldata() { st.editData = false; ui.render(); },
    savedata(no) {

      return commit(setData(S, no, patch, who(), deps.now()), no);
    },
    shape(no, el) { return commit(setShape(S, no, +el.dataset.g, el.value, who(), deps.now()), no); },
    ack(no, el) { setAck(S, no, !!el.checked); saveCache(); },
    async approve(no) {
      if (crossBusy[no] && Date.now() - crossBusy[no] < 20000) { toast(t('err.cross_running')); return; }
      const r = approve(S, no, who(), deps.now());

        // disetujui dari peta: tutup mode edit dan langsung kembali ke Beranda
        if (st.mapEdit === no) { st.mapEdit = null; st.mapAdd = false; st.tab = 'home'; }
      }
      return commit(r, no, r.ok ? t('toast.approved', { no }) : null);
    },
    unapprove(no) { return commit(unapprove(S, no, who(), deps.now()), no); },
    reread(no) { return commit(rereadRestore(S, no, who(), deps.now()), no, t('toast.reread')); },
    editmap(no) { st.detailNo = null; st.mapEdit = no; st.mapAdd = false; st.tab = 'map'; ui.render(); },
    mapdone() { st.mapEdit = null; st.mapAdd = false; ui.render(); },
    mapadd() { st.mapAdd = !st.mapAdd; ui.render(); },
    mapfilter(no) { st.mapFilter = no; ui.render(); },
    listtab(no) { st.listTab = no === 'dibatalkan' ? 'dibatalkan' : 'aktif'; ui.render(); },
    makeExport() {
      st.ready = null;
      const r = makeExport(S, who(), deps.now(), deps.today());
      return commit(r, null, r.ok ? t('toast.exported', { n: r.export.list.length }) : null);
    },
    makeFullExport() {
      if (!ask.confirm(t('export.confirm_full'))) return;
      st.ready = null;
      const r = makeFullExport(S, who(), deps.now(), deps.today());
      return commit(r, null, r.ok ? t('toast.exported_full', { n: r.export.list.length }) : null);
    },
    reExport() {
      const r = reExport(S, who(), deps.now());
      return commit(r, null, r.ok ? t('toast.reexported', { n: r.export.list.length }) : null);
    },
    exportstep() {
      const r = exportStepDone(S, who(), deps.now());
      return commit(r, null, r.ok && r.done ? t('toast.installed') : null);
    },
    ...SAVE,
    /* tombol demo (hanya bila deps.demo ada) */
    async demo1() { const d = deps.demo; if (!d) return; d.api.queueItems(d.items); await doCheck(); },
    async demo2() {
      const d = deps.demo; if (!d) return;
      const no = d.scenarioItem.no;
      d.api.queueItems([d.scenarioItem]);
      d.api.setText(no, d.scenarioText(d.texts[no]));
      await doCheck();
    },
    async demo3() {
      const d = deps.demo; if (!d) return;
      st.demoDown = !st.demoDown;
      d.api.setFail(st.demoDown ? 'err_mpa_blocked' : null);
      if (st.demoDown) {
        const ago = new Date(Date.parse(deps.now()) - 30 * 36e5).toISOString();
        S.lastCheckOk = ago; S.lastCheck = deps.now();
        addLog(S, 'Server', 'check_failed', { reason: 'err_mpa_blocked' }, deps.now());
        toast(t('toast.demo_down'));
        await persist();
      } else { toast(t('toast.demo_up')); await doCheck(); }
    },
    async demoreset() {
      const d = deps.demo; if (!d) return;
      if (!ask.confirm(t('demo.confirm_reset'))) return;
      st.detailNo = null; st.mapEdit = null; st.tab = 'home'; st.demoDown = false;
      await d.reset();
      await sync.pull(S);
      saveCache(); ui.render();
    },
  };

  async function act(name, no, el) {
    const f = ACT[name];
    if (!f) return;
    try { await f(no, el || { dataset: {} }); } catch (e) {
      // keterangan singkat (nama dan pesan galat, dipotong) supaya penyebab terlihat di layar HP; tidak memuat data PMN atau rahasia
      const why = e && (e.name || e.message) ? ' [' + String((e.name || 'Error') + ': ' + (e.message || '')).slice(0, 110) + ']' : '';
      toast(t('err.unexpected') + why);
      if (typeof console !== 'undefined') console.error(e);
    }
  }

  /** Berkas PDF yang dipilih officer: dibaca, diurai, ditambahkan sebagai draf. */
  async function addFiles(files) {
    for (const f of files) {
      let text;
      try { text = await deps.readPdf(f); } catch (e) { toast(t('err.pdf_js_load')); continue; }
      const result = parsePmnText(text, {});
      const opts = {};
      if (!result.no) {
        const n = ask.prompt(t('pdf.ask_number', { file: f.name }));
        if (!n || !NO_RE.test(String(n).trim())) { toast(t('err.no_number')); continue; }
        opts.no = String(n).trim();
      }
      let r = addFromPdf(S, result, f.name, who(), deps.now(), opts);
      if (!r.ok && r.code === 'exists') {
        const no = opts.no || result.no;
        if (r.status !== 'diekspor' && r.status !== 'terpasang' && ask.confirm(t('pdf.confirm_replace', { no, status: statusText(r.status) }))) {
          r = addFromPdf(S, result, f.name, who(), deps.now(), Object.assign({ replace: true }, opts));
        } else if (r.status === 'diekspor' || r.status === 'terpasang') { fail(r, no); continue; } else continue;
      }
      if (!r.ok) { fail(r); continue; }
      const w = S.pm[r.no].work;
      toast(w.kind === 'plot' ? t('toast.pdf_plot', { no: r.no, n: countPoints(w) }) : t('toast.pdf_kind', { no: r.no, kind: t('toast.kind_' + w.kind) }));
      st.detailNo = r.no;
      await persist();
    }
  }
  const countPoints = w => w.groups.reduce((n, g) => n + g.pts.length, 0);

  async function movePoint(no, gi, pi, lat, lon) { return commit(setPoint(S, no, gi, pi, lat, lon, who(), deps.now()), no); }
  async function addPointAt(no, lat, lon) { st.mapAdd = false; return commit(addPoint(S, no, lat, lon, '', who(), deps.now()), no); }
  function setLang(l) { i18n.setLang(l); if (i18n.getLang() === l) storage.setItem('pmn-lang', l); ui.render(); }

  return { act, st, ctx, pending, flush, persist, addFiles, movePoint, addPointAt, setLang, deps };
}

/* ===== Perangkaian aplikasi di browser: penyimpanan, bahasa, officer, render, peristiwa ===== */

const TABS = [['home', '⌂', 'nav.home'], ['map', '◎', 'nav.map'], ['list', '☰', 'nav.list'], ['export', '⇪', 'nav.export'], ['add', '＋', 'nav.add']];

/**
 * Berkas di perangkat untuk ekspor (deps.files pengendali). Tidak pernah melempar ke tampilan.
 * share: lembar Bagikan bila peramban bisa membagikan berkas, selain itu unduh biasa.
 */
function createDeviceFiles(win, doc) {
  function download(list) {
    for (const f of list) {
      const url = win.URL.createObjectURL(f.blob), a = doc.createElement('a');
      a.href = url; a.download = f.name; a.style.display = 'none';
      doc.body.appendChild(a); a.click(); a.remove();
      win.setTimeout(() => win.URL.revokeObjectURL(url), 60000);
    }
    return { ok: true, downloaded: true };
  }
  return {
    async share(list) {
      try {
        const nav = win.navigator, fs = list.map(f => new win.File([f.blob], f.name, { type: f.blob.type || 'application/octet-stream' }));
        if (nav.share && nav.canShare && nav.canShare({ files: fs })) {
          try { await nav.share({ files: fs }); return { ok: true }; }
          catch (e) { if (e && e.name === 'AbortError') return { ok: false, cancelled: true }; /* sentuhan kedaluwarsa dll.: unduh biasa */ }
        }
        return download(list);
      } catch (e) { return { ok: false }; }
    },
    /** Pemilih berkas .xlsx: {buf, name} atau null. Dibatalkan bila jendela kembali fokus tanpa berkas (tidak semua peramban
        mengirim 'cancel') atau setelah 60 detik, supaya tombol tidak terkunci selamanya. */
    pickExcel() {
      return new Promise(done => {
        let settled = false, inp = null, safety = null;
        const onFocus = () => win.setTimeout(() => { if (!inp || !inp.files || !inp.files.length) finish(null); }, 800);
        const finish = v => {
          if (settled) return; settled = true;
          try { win.removeEventListener('focus', onFocus); win.clearTimeout(safety); if (inp) inp.remove(); } catch (e) { /* abaikan */ }
          done(v);
        };
        try {
          inp = doc.createElement('input');
          inp.type = 'file'; inp.accept = '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'; inp.style.display = 'none';
          inp.addEventListener('change', async () => {
            const f = inp.files && inp.files[0];
            if (!f) { finish(null); return; }
            try { finish({ buf: await f.arrayBuffer(), name: f.name }); } catch (e) { finish(null); }
          });
          inp.addEventListener('cancel', () => finish(null));
          win.addEventListener('focus', onFocus);
          safety = win.setTimeout(() => finish(null), 60000);
          doc.body.appendChild(inp);
          inp.click();
        } catch (e) { finish(null); }
      });
    },
  };
}

function startApp(win, doc) {
  const storage = createStorage(win);
  const $ = id => doc.getElementById(id);
  const nowIso = () => new Date().toISOString();
  const deviceLang = () => { const l = String((win.navigator && win.navigator.language) || ''); return /^en/i.test(l) ? 'en' : 'id'; };
  const i18n = createI18n({ id: ID, en: EN }, storage.getItem('pmn-lang') || deviceLang());
  const officer = () => storage.getItem('pmn-officer') || DEFAULT_OFFICERS[0];

  /* mode demo = API tiruan yang tersimpan di perangkat; backend sungguhan datang di Rencana 3 */
  /* mode server: alamat dan kode dari Pengaturan; tanpa keduanya aplikasi berjalan di mode demo */
  const serverUrl = storage.getItem('pmn-server-url'), serverCode = storage.getItem('pmn-server-code');
  const live = !!(serverUrl && serverCode);
  const makeApi = (url, code) => createHttpApi({ url, code, officer, fetch: win.fetch.bind(win) });
  const stubTexts = {};
  for (const it of DEMO_ITEMS) if (DEMO_TEXTS[it.no]) stubTexts[it.no] = DEMO_TEXTS[it.no];
  const api = live ? makeApi(serverUrl, serverCode) : createStubApi(storage, { texts: stubTexts });
  /* demo lokal: bila ada berkas contoh-pdf/ di samping index.html, PDF asli dipakai (halaman tergambar); selain itu teks */
  const stubGetPdf = api.getPdf;
  if (!live) api.getPdf = async no => {
    if (/^https?:/.test(win.location.protocol)) {
      try {
        const r = await win.fetch('contoh-pdf/PMN-' + baseNo(String(no)).replace('/', '-') + '.pdf');
        if (r.ok) {
          const bytes = new Uint8Array(await r.arrayBuffer());
          let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
          return { ok: true, base64: win.btoa(bin) };
        }
      } catch (e) { /* tanpa berkas contoh: pakai teks */ }
    }
    return stubGetPdf(no);
  };
  const memStore = (() => { const m = new Map(); return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) }; })();
  async function seedDemo() {
    if (!DEMO_TEXTS[DEMO_NOS.history[0]]) return;
    const S0 = buildDemoState(DEMO_TEXTS, nowIso(), officer());
    await createSync({ api, storage: memStore, now: nowIso }).push(S0);
  }
  const demo = live ? null : {
    api, items: DEMO_ITEMS, scenarioItem: DEMO_SCENARIO_ITEM, texts: DEMO_TEXTS, scenarioText,
    async reset() { for (const k of ['pmn-stub-server', 'pmn-cache', 'pmn-outbox']) storage.removeItem(k); await seedDemo(); },
  };

  let S = newState();
  try { const c = storage.getItem('pmn-cache'); if (c) S = Object.assign(newState(), JSON.parse(c)); } catch (e) { /* cache rusak: mulai kosong */ }
  const sync = createSync({ api, storage, now: nowIso });
  const fileIn = $('pdfin');
  const toastEl = $('toast');
  let toastTimer = null;
  let mapInst = null, lastTab = null, settingsKey = null;

  const ctrl = createController({
    S, api, sync, storage, i18n, now: nowIso, today: () => sgtToday(new Date()), officer,
    readPdf: readPdfFile,
    pdfTextFromBase64: async b64 => { const bin = win.atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return readPdfFile(new Blob([bytes])); },
    ask: { confirm: m => win.confirm(m), prompt: m => win.prompt(m) },
    clipboard: { write: text => (win.navigator.clipboard ? win.navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard'))) },
    dom: { val: id => { const e = $(id); return e ? e.value : ''; }, set: (id, v) => { const e = $(id); if (e) e.value = v; } },
    ui: { render, toast, pickFile: () => fileIn.click() },
    demo, live, makeApi, reload: () => win.location.reload(),
    files: createDeviceFiles(win, doc),
  });

  function toast(m) { toastEl.textContent = m; toastEl.hidden = false; win.clearTimeout(toastTimer); toastTimer = win.setTimeout(() => { toastEl.hidden = true; }, 3200); }

  function mapDeps() {
    return {
      L: win.L, t: i18n.t,
      onOpen: no => ctrl.act('open', no),
      onMovePoint: (no, gi, pi, lat, lon) => { if (mapInst) mapInst.keepView(); ctrl.movePoint(no, gi, pi, lat, lon); },
